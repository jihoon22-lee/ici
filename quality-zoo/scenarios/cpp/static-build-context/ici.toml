[ici]
profile = "deep"

[project]
name = "qz-static-build-context"
version = "1.0.0"
type = "cpp"
source_dirs = ["src"]

[doctor]
required_tools = ["g++", "cmake"]

[engines.line]
enabled = false
[engines.lint]
enabled = true
required = true
clang_tidy = "off"
clazy = "off"
[engines.compile_db]
enabled = true
required = true
database_required = true
[engines.test]
enabled = false
[engines.type]
enabled = false
[engines.python_compat]
enabled = false
[engines.complexity]
enabled = false
[engines.sanitize]
enabled = false
[engines.thread_sanitize]
enabled = false
[engines.dead]
enabled = false
[engines.dup]
enabled = false
[engines.exception]
enabled = false
[engines.cycle]
enabled = true
required = false
[engines.cognitive]
enabled = false
[engines.security]
enabled = false
[engines.resource]
enabled = false
[engines.build]
enabled = false
[engines.binary_compat]
enabled = false
[engines.integration]
enabled = false
