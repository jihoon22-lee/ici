[ici]
profile = "deep"

[project]
name = "quality-zoo-cpp-tsan-synchronized"
version = "1.0.0"
type = "cpp"
source_dirs = ["src"]

[doctor]
required_tools = ["g++", "cmake"]

[engines.line]
enabled = false
[engines.lint]
enabled = false
[engines.compile_db]
enabled = false
[engines.test]
enabled = false
[engines.type]
enabled = false
[engines.complexity]
enabled = false
[engines.sanitize]
enabled = false
[engines.dead]
enabled = false
[engines.dup]
enabled = false
[engines.exception]
enabled = false
[engines.cycle]
enabled = false
[engines.cognitive]
enabled = false
[engines.security]
enabled = false
[engines.resource]
enabled = false
[engines.thread_sanitize]
enabled = true
required = true
mode = "pass_fail"
