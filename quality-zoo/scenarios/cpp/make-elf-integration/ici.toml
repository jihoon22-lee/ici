schema_version = 1

[workspace]
name = "qz-make-elf-integration"
profile = "deep"

[builds.make]
system = "make"
directory = "build/ici-make"
variant = "default"
artifacts = ["app", "lib/libgreeter.so"]

[[components]]
id = "zoo"
root = "."
languages = ["cpp"]
build = "make"
sources = ["src/**/*.cpp"]

[checks."cpp.line"]
enabled = false

[checks."cpp.compile"]
enabled = false

[checks."cpp.diagnostics"]
enabled = false

[checks."cpp.tidy"]
enabled = false

[checks."cpp.test"]
enabled = false

[checks."cpp.complexity"]
enabled = false

[checks."cpp.cognitive"]
enabled = false

[checks."cpp.cycle"]
enabled = false

[checks."cpp.dup"]
enabled = false

[checks."cpp.exception"]
enabled = false

[checks."cpp.coverage"]
enabled = false

[checks."cpp.artifact"]
enabled = true

[checks."cpp.sanitize"]
enabled = false

[checks."cpp.tsan"]
enabled = false

[checks."cpp.binary-compat"]
enabled = true
