schema_version = 1

[workspace]
name = "qz-malformed-compile-db"
profile = "deep"

[builds.db]
system = "cmake"
directory = "build_db"
variant = "default"

[[components]]
id = "zoo"
root = "."
languages = ["cpp"]
build = "db"
sources = ["src/**/*.cpp"]

[checks."cpp.line"]
enabled = false

[checks."cpp.compile"]
enabled = true

[checks."cpp.diagnostics"]
enabled = false

[checks."cpp.tidy"]
enabled = false

[checks."cpp.test"]
enabled = false

[checks."cpp.complexity"]
enabled = false

[checks."cpp.cognitive"]
enabled = false

[checks."cpp.cycle"]
enabled = false

[checks."cpp.dup"]
enabled = false

[checks."cpp.exception"]
enabled = false

[checks."cpp.coverage"]
enabled = false

[checks."cpp.artifact"]
enabled = false

[checks."cpp.sanitize"]
enabled = false

[checks."cpp.tsan"]
enabled = false

[checks."cpp.binary-compat"]
enabled = false
