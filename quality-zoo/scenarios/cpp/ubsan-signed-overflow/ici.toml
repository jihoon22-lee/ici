schema_version = 1

[workspace]
name = "quality-zoo-cpp-ubsan-signed-overflow"
profile = "deep"

[builds.san]
system = "cmake"
project = "CMakeLists.txt"
directory = "build"
variant = "sanitize"
artifacts = ["test_*"]

[[components]]
id = "zoo"
root = "."
languages = ["cpp"]
build = "san"
sources = ["src/**/*.cpp", "src/**/*.hpp", "src/**/*.h"]

[checks."cpp.line"]
enabled = false

[checks."cpp.compile"]
enabled = false

[checks."cpp.diagnostics"]
enabled = false

[checks."cpp.tidy"]
enabled = false

[checks."cpp.test"]
enabled = false

[checks."cpp.complexity"]
enabled = false

[checks."cpp.cognitive"]
enabled = false

[checks."cpp.cycle"]
enabled = false

[checks."cpp.dup"]
enabled = false

[checks."cpp.exception"]
enabled = false

[checks."cpp.coverage"]
enabled = false

[checks."cpp.artifact"]
enabled = false

[checks."cpp.sanitize"]
enabled = true

[checks."cpp.tsan"]
enabled = false

[checks."cpp.binary-compat"]
enabled = false
