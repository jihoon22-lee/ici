schema_version = 1

# The Qt-free `icirv` CLI is the closed-network deliverable: it ships as a
# release asset and has to run on a host with no Qt and an older glibc than
# the builder's. This workspace makes the artifact contract a measurement:
# `cpp.binary-compat` reads the declared binary with readelf and judges the
# loader entries it is allowed to hold.
#
# Everything except the artifact contract is already covered by the main
# `ici.toml` dogfood run in the same job; the checks are disabled here rather
# than re-measured. The static-linkage claim itself (`require_static` and the
# class/machine floors) is not declarable on this check yet — CI asserts it
# directly with readelf in the same step, and the check's limitation note
# says the deployment floors went unjudged.
#
# Usage: ../dist/ici.pyz verify --config ici-static-cli.toml

[workspace]
name = "icirv-static-cli"
profile = "deep"

[builds.static]
system = "cmake"
project = "CMakeLists.txt"
directory = "build/ici-static"
variant = "default"
prepare = "explicit"
artifacts = ["icirv"]

[[components]]
id = "cli"
root = "."
languages = ["cpp"]
build = "static"
sources = ["src/**/*.cpp", "src/**/*.hpp", "src/**/*.h"]

[checks."cpp.line"]
enabled = false

[checks."cpp.compile"]
enabled = false

[checks."cpp.diagnostics"]
enabled = false

[checks."cpp.tidy"]
enabled = false

[checks."cpp.test"]
enabled = false

[checks."cpp.complexity"]
enabled = false

[checks."cpp.cognitive"]
enabled = false

[checks."cpp.cycle"]
enabled = false

[checks."cpp.dup"]
enabled = false

[checks."cpp.exception"]
enabled = false

[checks."cpp.coverage"]
enabled = false

[checks."cpp.sanitize"]
enabled = false

[checks."cpp.tsan"]
enabled = false

# `cpp.artifact` is advisory but must stay enabled: it produces the
# `artifact-contract` evidence `cpp.binary-compat` needs — disabling it would
# leave a required check permanently blocked.
[checks."cpp.artifact"]
required = false

[checks."cpp.binary-compat"]
required = true
