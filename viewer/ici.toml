[project]
name = "icirv"
version = "0.1.0"
source_dirs = ["src"]

# The Qt shell is project source like everything else, so it lives under src/
# and every text- and AST-based engine reads it. Two settings make that work:
#
#   cpp_pkg_config          gives lint the Qt include paths it needs to parse
#                           the widget sources at all. Listing both majors lets
#                           the same config work on Qt 6 and Qt 5 hosts.
#   cpp_external_build_dirs is retained for the generic g++ fallback. The
#                           CMake adapter ignores it because CMake runs moc and
#                           builds the GUI target itself.
#
# The GUI is linted, measured for complexity and duplication, and scanned for
# exception and security problems. The root CMake adapter also builds and tests
# it when Qt is available.
cpp_pkg_config = ["Qt6Widgets", "Qt5Widgets"]
cpp_external_build_dirs = ["src/gui"]

# 임계값을 명시적으로 고정한다. 생략하면 개발자 홈의 ~/.config/ici/ici.toml 을 따르게 되어
# 로컬과 CI 결과가 갈린다. 값은 ici 기본 정책과 동일하다.
[engines.test]
enabled = true
mode = "pass_fail"
min_tem_score = 4.0
min_branch_cov = 80.0
min_func_cov = 90.0

# The viewer is ici's in-repository exact C++ acceptance target. Its CMake
# compilation database must cover every production TU for this probe.
[engines.dead]
cpp_unused = "required"
