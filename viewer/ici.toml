schema_version = 1

# icirv — the HTML report viewer's C++ core.
#
# ici does not build this component itself (ici never builds): the CI job
# configures and builds `build/ici-main` with coverage instrumentation and a
# compile_commands.json export, and this workspace reads that tree. The gate
# this file replaces measured tests (ctest + the Qt widget test), gcov
# coverage (branch 80 / function 90 floors — enforced by
# scripts/check_run_floors.py on the saved result), and cpp_unused as a
# required check; next has no `cpp.dead` check, so the unused-function gate
# does not carry over.

[workspace]
name = "icirv"
profile = "standard"

[builds.main]
system = "cmake"
project = "CMakeLists.txt"
directory = "build/ici-main"
variant = "default"
prepare = "explicit"
artifacts = ["icirv"]

# Source scope matches the stable dogfood's source_dirs = ["src"]: the tests
# directory belongs to the ctest suite the build produces, not to the static
# analysis scope — stable counted it the same way.
[[components]]
id = "viewer"
root = "."
languages = ["cpp"]
build = "main"
sources = ["src/**/*.cpp", "src/**/*.hpp", "src/**/*.h"]

[components.cpp]
qt = true

# Same contract as the repo root: heuristic clone findings are measured and
# reported but advisory; the numeric dogfood floor lives in
# scripts/check_next_floors.py --set viewer.
[checks."cpp.dup"]
required = false
