# The fixture that motivated this manifest. Qt6 is a requirement of the
# CMakeLists, not of cmake, and only cmake can answer whether it is reachable.
[[fixture]]
id = "cpp/cmake_project"
path = "examples/cpp-fixtures/cmake_project"
kind = "real-tool"
languages = ["cpp"]
requires = [
  { executable = "cmake" },
  { executable = "ctest" },
  { executable = "gcov" },
  { cmake_package = "Qt6", components = ["Core", "Test"] },
]
cost = "slow"
provenance = "authored for ici"
license = "same as repository"
expectation = "configure, build and ctest succeed; coverage is 100% line, function and branch for src/counter.cpp"
exercised_by = []

# qmake does not have the same problem: qmake ships with Qt, so finding the
# program is enough to know the libraries are there. Recorded because the
# asymmetry with cmake_project above is the whole point of the register.
[[fixture]]
id = "cpp/qmake_project"
path = "examples/cpp-fixtures/qmake_project"
kind = "real-tool"
languages = ["cpp"]
requires = [
  { any_executable = ["qmake6", "qmake"] },
  { executable = "make" },
  { executable = "gcov" },
]
cost = "slow"
provenance = "authored for ici"
license = "same as repository"
expectation = "a SUBDIRS build produces exactly one reported test, test_counter, and a compile_commands.json under build/ici-qmake-build"
exercised_by = []

