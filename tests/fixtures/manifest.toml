# --------------------------------------------------------------------------
# Quality Zoo — the ici-owned known-answer corpus (#201, R13). Migrated from
# toy-projects where the workflow checked it out across repositories; the
# corpus now lives in this repository so a candidate is verified against the
# expectations the same commit carries.
#
# These are executable scenarios, not pytest fixtures: each directory holds a
# deliberately defective or clean miniature project plus per-artifact
# expectations under expectations/. candidate-quality-zoo.yml runs
# `python3.10 -m runner.run` over them, and `kind = "real-tool"` records that
# the run needs the listed toolchain present.
#
# `requires` mirrors each scenario's `[doctor] required_tools`, extended
# where an executable name cannot express a library: the Qt scenario's
# CMakeLists calls find_package(Qt6 REQUIRED), so its requirement is a
# cmake_package probe, not an executable lookup.
# --------------------------------------------------------------------------

