# The control. A detector that fires here has gained a false positive, which is
# why #201's acceptance criteria ask for a clean counterpart and not only
# defect seeds.
[[fixture]]
id = "cpp/clean_baseline"
path = "examples/cpp-fixtures/clean_baseline"
kind = "data"
languages = ["cpp"]
requires = []
cost = "fast"
role = "control"
provenance = "authored for ici"
license = "same as repository"
expectation = "every text engine reports PASS with no findings"
exercised_by = ["tests/test_cpp_e2e.py::test_clean_baseline_produces_no_findings"]

# --------------------------------------------------------------------------
# C++ fixtures that need a real toolchain.
# --------------------------------------------------------------------------

[[fixture]]
id = "cpp/asan_overflow"
path = "examples/cpp-fixtures/asan_overflow"
kind = "real-tool"
languages = ["cpp"]
requires = [{ executable = "g++" }]
cost = "slow"
safety = "compiles and runs the fixture under ASan/UBSan; the binary reads past the end of a buffer on purpose"
provenance = "authored for ici"
license = "same as repository"
expectation = "SanitizeEngine reports FAIL with at least one finding"
exercised_by = ["tests/test_cpp_e2e.py::test_sanitize_detects_a_heap_overflow"]

[[fixture]]
id = "cpp/cmake_elf_dead"
path = "examples/cpp-fixtures/cmake_elf_dead"
kind = "real-tool"
languages = ["cpp"]
requires = [{ executable = "cmake" }, { executable = "g++" }, { executable = "nm" }]
cost = "slow"
provenance = "authored for ici"
license = "same as repository"
expectation = "the linker dead-symbol pass reports the unreferenced symbol"
exercised_by = ["tests/test_cpp_linker_dead_e2e.py"]

# The fixture that motivated this manifest. Qt6 is a requirement of the
# CMakeLists, not of cmake, and only cmake can answer whether it is reachable.
[[fixture]]
id = "cpp/cmake_project"
path = "examples/cpp-fixtures/cmake_project"
kind = "real-tool"
languages = ["cpp"]
requires = [
  { executable = "cmake" },
  { executable = "ctest" },
  { executable = "gcov" },
  { cmake_package = "Qt6", components = ["Core", "Test"] },
]
cost = "slow"
provenance = "authored for ici"
license = "same as repository"
expectation = "configure, build and ctest succeed; coverage is 100% line, function and branch for src/counter.cpp"
exercised_by = [
  "tests/test_build_adapter_e2e.py::test_cmake_fixture_builds_and_tests_a_q_object",
  "tests/test_build_adapter_e2e.py::test_cmake_fixture_reports_exact_gcov_values_and_geometry",
]

# qmake does not have the same problem: qmake ships with Qt, so finding the
# program is enough to know the libraries are there. Recorded because the
# asymmetry with cmake_project above is the whole point of the register.
[[fixture]]
id = "cpp/qmake_project"
path = "examples/cpp-fixtures/qmake_project"
kind = "real-tool"
languages = ["cpp"]
requires = [
  { any_executable = ["qmake6", "qmake"] },
  { executable = "make" },
  { executable = "gcov" },
]
cost = "slow"
provenance = "authored for ici"
license = "same as repository"
expectation = "a SUBDIRS build produces exactly one reported test, test_counter, and a compile_commands.json under build/ici-qmake-build"
exercised_by = [
  "tests/test_build_adapter_e2e.py::test_qmake_fixture_builds_and_tests_a_q_object",
  "tests/test_build_adapter_e2e.py::test_qmake_fixture_captures_compilation_context",
]

