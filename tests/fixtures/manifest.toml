# The corpus register (WP03 #201, step 1).
#
# Every fixture this repository owns is declared here with what it actually
# needs to run, what it is supposed to produce, and where it came from. Two
# things follow from having it, and neither is available from the fixtures
# themselves:
#
# - a run is guarded on the fixture's declared requirements instead of a list
#   copied by hand. The v0.13.x `examples/cpp-fixtures/cmake_project` was why:
#   its CMakeLists called find_package(Qt6 REQUIRED), the tests that used it
#   guarded on cmake/ctest/gcov, and cmake being present says nothing at all
#   about Qt6.
# - "not run" stays distinguishable from "passed". A fixture whose tools are
#   absent is explicitly unexecuted and does not count toward release evidence
#   (#201 step 4).
#
# `requires` entries are probes, not names, because "is Qt6 available to cmake"
# is not answerable by looking for a file called Qt6:
#
#   executable = "cmake"              one program on PATH
#   any_executable = ["qmake6", ...]  any one of several spellings
#   cmake_package = "Qt6"             ask cmake whether find_package succeeds
#
# `kind` separates the two populations #201 step 4 asks to keep apart:
#
#   real-tool   runs a native toolchain; skipped honestly when it is missing
#   data        a file the tests read; no external requirement, always runs
#
# `provenance` records where the content came from. Everything here is written
# for this repository — no vendored third-party source, no internal code.
#
# Since the R9 Rust cutover the register holds the ici-next wire documents the
# Rust tests read and the Quality Zoo scenarios. The v0.13.x `examples/` fixture
# trees and the pyz next dogfood fixture were removed with the Python product
# tests that used them (see the v0.13.0 tag for their history). The register's
# contract tests are stdlib unittest suites under scripts/tests/.

schema_version = "ici.fixture-manifest/v1"

