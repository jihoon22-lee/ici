# Development harness only. The ici product is the Rust workspace in Cargo.toml
# (ADR-0008); this file builds no package and nothing in it is distributed.
#
# The harness environment (`uv sync --frozen --python 3.10`, `.venv/bin/python`)
# is the *project* Python some Rust CLI tests run as an external tool (pytest,
# coverage, mypy, ruff), plus the interpreter for the Python left in this
# repository: the migration ledger, the candidate Merge Gate audit, the
# tests/rust-parity capture drivers and the Quality Zoo runner.
[project]
name = "ici-dev-harness"
version = "0.0.0"
description = "Development harness for the ici Rust workspace (not distributed)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "coverage>=7.0",
    # Rust CLI tests resolve .venv/bin/ruff as the project's own Ruff, and the
    # harness Python is linted with it. Upper bound: ruff format rules change
    # between minor versions and `--check` would break without a code change.
    "ruff>=0.16,<0.17",
    # scripts/tests reads the TOML fixture register on Python 3.10.
    "tomli>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"          # harness는 Python 3.10에서 돈다. 3.11+ 문법을 lint 실패로 만든다
line-length = 100
src = ["scripts"]
# quality-zoo 는 ici 소유의 known-answer corpus다. 시나리오 소스는 의도적으로
# 린트 위반·결함을 포함하므로 lint/format 대상에서 제외한다. corpus 자체의
# runner/tests 코드 품질은 quality-zoo/tests 계약 테스트가 담당한다.
extend-exclude = ["quality-zoo"]

[tool.ruff.format]
# Markdown prose is not source. ruff formats fenced Python blocks inside .md,
# and design docs quote class methods in context — reformatting strips their
# indentation and turns a method into a module-level function, so the document
# ends up describing something that would not compile.
exclude = ["*.md", "quality-zoo"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade (target-version 이 py310 이라 3.10 이하로만 제안)
    "B",             # bugbear
    "SIM",           # simplify
    "TID",           # tidy-imports (banned-api)
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
# tests/rust-parity capture drivers import the frozen v0.13.0 `ici` package from
# an oracle checkout; it stays first-party so their import blocks are unchanged.
known-first-party = ["ici"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tomllib".msg = "tomllib 은 3.11+ 다. harness 는 3.10 에서 돌므로 tomli 를 쓴다."
"requests".msg = "certifi 번들 CA 때문에 사내 TLS 인터셉션 환경에서 깨진다. stdlib urllib 을 쓴다."
"httpx".msg = "certifi 번들 CA 때문에 사내 TLS 인터셉션 환경에서 깨진다. stdlib urllib 을 쓴다."
"certifi".msg = "시스템 CA 를 써야 한다. ssl.create_default_context()."

[tool.pytest.ini_options]
# The repository-asset suites are stdlib unittest; pytest can collect them too.
testpaths = ["scripts/tests"]
addopts = "-q"
