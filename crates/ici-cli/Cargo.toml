[package]
name = "ici-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ici"
path = "src/main.rs"

[dependencies]
ici-domain = { path = "../ici-domain" }
ici-config = { path = "../ici-config" }
ici-application = { path = "../ici-application" }
ici-analysis = { path = "../ici-analysis" }
sha1 = "0.10"
ici-cpp = { path = "../ici-cpp" }
ici-validation = { path = "../ici-validation" }
ici-execution = { path = "../ici-execution" }
ici-providers = { path = "../ici-providers" }
ici-reporting = { path = "../ici-reporting" }
ici-distribution = { path = "../ici-distribution" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
signal-hook = "=0.3.18"
clap = { version = "=4.6.7", features = ["string"] }
serde.workspace = true
serde_json.workspace = true
percent-encoding = "=2.3.2"
base64 = "=0.22.1"
toml_edit = { version = "=0.25.13", features = ["serde"] }
thiserror.workspace = true
tempfile = "=3.27.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
