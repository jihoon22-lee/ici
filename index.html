<!DOCTYPE html>

<title>ici Reports</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 24px;color:#1f2937}
code{background:#f3f4f6;padding:2px 6px;border-radius:4px}

<body>
<h1>📊 ici HTML Reports</h1>
<p>각 프로젝트의 <code>ici verify --publish</code> 결과가 아래 경로에 게시됩니다.</p>
<ul>
<li>PR 리포트: <code>/pr/&lt;number&gt;/</code></li>
<li>메인 브랜치: <code>/main/</code></li>
</ul>
<p>아직 리포트가 없으면 PR의 스티키 댓글에 안내된 링크를 확인하세요.</p>
</body>
