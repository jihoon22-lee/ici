name: CI Quality Gate (Dogfooding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Dogfood ici
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # uv run 을 쓰는 이유: uvx 는 ruff 를 임시로 내려받아 실행할 뿐 PATH 에 남기지 않아,
      # 뒤의 도그푸딩 스텝에서 lint 엔진이 ruff 를 못 찾고 AST 폴백으로 내려간다.
      # uv run 은 프로젝트 .venv 에 설치하므로 엔진과 CI 가 같은 바이너리를 쓴다.
      - name: Code Style & Lint Check
        run: |
          uv run --python 3.10 ruff check .
          uv run --python 3.10 ruff format --check .

      - name: Unit Tests & Coverage
        run: |
          uv run --python 3.10 pytest -v

      # Runs the C++ engines against deliberately broken fixtures, so a detector
      # that stops detecting fails here. The unit tests cover parsing; these
      # cover the path a real project takes.
      - name: C++ Detection Fixtures
        run: |
          uv run --python 3.10 pytest tests/test_cpp_e2e.py -v

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      - name: Run Isolated Smoke Test
        run: |
          ./scripts/smoke.sh

      - name: 🐶 Dogfooding — Self-Verification Gate via ici
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz verify --report --html verify_report.html --github-summary

      # viewer/ 는 순수 C++17 코어라 Qt 없이 빌드된다. 이 스텝이 있어야 ici 의 C++ 경로
      # (lint 의 g++ 진단, test 의 gcov 커버리지, sanitize 의 ASan/UBSan, cycle 의 include 순환)가
      # CI 에서 실제로 실행된다 — 그 전까지 C++ 엔진은 단위 테스트로만 덮여 있었다.
      # --github-summary 는 $GITHUB_STEP_SUMMARY 에 append 하므로, Actions 실행 요약에
      # Python 결과와 C++ 결과가 나란히 남는다. 두 리포트를 모두 볼 수 있어야 한다 —
      # viewer/ 도 이 저장소의 소스코드다.
      # viewer/src/gui is project source and is linted like the rest of it, so
      # the verify job needs Qt's headers — not to build a GUI, but to parse one.
      - name: Install Qt6 headers for the C++ gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev pkg-config

      - name: 🐶 Dogfooding — C++ Gate via ici (viewer/)
        working-directory: viewer
        run: ../dist/ici.pyz verify --report --html verify_report.html --github-summary

      - name: Upload Verification Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ici-verification-report
          path: |
            verify_report.html
            verify_report.json
            viewer/verify_report.html
            viewer/verify_report.json
          retention-days: 14

  # The Qt shell sits outside every ici engine's scope by design — the core is
  # what gets verified — so nothing else would notice a broken GUI build.
  viewer-gui:
    name: Qt6 Viewer GUI build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Configure and build
        working-directory: viewer
        run: |
          cmake -S src/gui -B src/gui/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/gui/build -j

      # Loads a real report headlessly, so a GUI that links but dies on startup
      # or while parsing still fails the gate.
      - name: Headless smoke run
        working-directory: viewer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ./src/gui/build/icirv-gui "$PWD/tests/data/ici_self_report.json" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::viewer GUI exited before the smoke window elapsed"
            wait "$pid" || true
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "viewer GUI stayed up through a report load"

  report-pr:
    name: Publish PR Report & Sticky Comment
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh-pages 업로드 (Contents API)
      pull-requests: write  # sticky 댓글 작성/갱신
      pages: read           # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      # PR head가 아닌 base(병합 대상 main)를 체크아웃한다: 이 job은
      # contents:write + pull-requests:write 를 가진 신뢰된 job이므로, 여기서
      # 빌드해 실행하는 dist/ici.pyz는 신뢰된 코드에서만 나와야 한다. PR이
      # 실제로 검증된 내용(verify_report.html/json)은 verify job의 아티팩트로만
      # 받으므로, PR 소스 자체를 이 job에서 체크아웃할 필요가 없다.
      - name: Checkout Trusted Base Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      - name: Download Verification Reports (artifact)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ici-verification-report
          path: .

      # Both reports in one comment. This repository verifies two things — the
      # Python package at the root and the C++ viewer under viewer/ — and a
      # comment carrying only the first hides half the gate. The root needs an
      # explicit label because its directory name is ".".
      - name: Publish HTML Reports & Sticky PR Comment
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz publish --report-dir ici=. --report-dir viewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-main:
    name: Publish Main Verification Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read       # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      - name: Checkout Main Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      - name: Publish Trusted Main Verification Report
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz verify --html verify_report.html --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
