name: CI Quality Gate (Dogfooding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Dogfood ici
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installed before 3.10 on purpose. setup-python puts the last version it
      # installs first on PATH, and every other step in this job must resolve
      # 3.10 as the default. This one only has to leave `python3.14` findable so
      # python_compat measures the newest supported runtime next to the floor.
      - name: Set up the newest supported Python (3.14)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      # uv run 을 쓰는 이유: uvx 는 ruff 를 임시로 내려받아 실행할 뿐 PATH 에 남기지 않아,
      # 뒤의 도그푸딩 스텝에서 lint 엔진이 ruff 를 못 찾고 AST 폴백으로 내려간다.
      # uv run 은 프로젝트 .venv 에 설치하므로 엔진과 CI 가 같은 바이너리를 쓴다.
      - name: Code Style & Lint Check
        run: |
          uv run --python 3.10 ruff check .
          uv run --python 3.10 ruff format --check .
          project_python="$GITHUB_WORKSPACE/.venv/bin/python"
          test -x "$project_python"
          printf 'ICI_PYTHON=%s\n' "$project_python" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$project_python")" >> "$GITHUB_PATH"

      # Installed before pytest, not after: the build-adapter E2E tests run
      # inside pytest and need cmake/qmake/Qt. viewer/src/gui is project source
      # and is linted like the rest of it, so the later verify step needs Qt's
      # headers too — not to build a GUI, but to parse one.
      #
      # qmake6 is a separate package from qt6-base-dev. clang-tidy and clazy
      # keep the I4 actual-process adapter tests and dogfood path non-skippable.
      # cmake ships with the runner image.
      - name: Install the C++ toolchain for the adapters and the C++ gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qmake6 pkg-config clang-tidy clazy

      - name: Unit Tests & Coverage
        env:
          # The adapter E2E tests skip when cmake/qmake/Qt are missing. They are
          # present on this runner, so a skip means something broke — and a
          # silently skipped gate is how lint went unrun for several releases
          # (C-6).
          ICI_REQUIRE_BUILD_ADAPTERS: "1"
          ICI_REQUIRE_STATIC_ANALYSIS_TOOLS: "1"
        run: |
          uv run --python 3.10 pytest -v

      # Runs the C++ engines against deliberately broken fixtures, so a detector
      # that stops detecting fails here. The unit tests cover parsing; these
      # cover the path a real project takes.
      - name: C++ Detection Fixtures
        run: |
          uv run --python 3.10 pytest tests/test_cpp_e2e.py -v

      # The corpus's own contract tests: runner/manifest/expectation integrity.
      # They live outside pytest's testpaths on purpose — they are the corpus's
      # unit suite, not ici's — and run on the pinned 3.10 the workflow uses.
      - name: Quality Zoo corpus unit tests
        working-directory: quality-zoo
        run: |
          python3.10 -m unittest discover -s tests -v

      - name: Build Reproducible Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/verify-reproducibility.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/verify-reproducibility.sh

      - name: Run Isolated Smoke Test
        run: |
          ./scripts/smoke.sh

      - name: 🐶 Dogfooding — Self-Verification Gate via ici
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz verify --result verify_report.json
          dist/ici.pyz report --result verify_report.json --out verify_report.html --sarif verify_report.sarif
          # The stable warn/fail bands became ratchet floors on the result's
          # measurements — see the script header for where the numbers came from.
          python scripts/check_next_floors.py verify_report.json

      # viewer/ 는 순수 C++17 코어라 Qt 없이 빌드된다. 이 스텝이 있어야 ici 의 C++ 경로
      # (diagnostics, ctest, gcov 커버리지, include 순환, ELF 계약)가
      # CI 에서 실제로 실행된다 — 그 전까지 C++ 분석은 단위 테스트로만 덮여 있었다.
      # The viewer-gui job proves a configure-time property ici cannot express:
      # the CLI configures with both Qt package families disabled. This proves
      # the other half — the linkage policy of the produced binary, from ici's
      # own readelf evidence — so the release asset's static contract is a
      # measurement in a report rather than a grep in a shell script.
      #
      # It runs here rather than in viewer-gui because dist/ici.pyz and the Qt6
      # toolchain already exist in this job; rebuilding the pyz there to run one
      # check would double the build for no extra coverage.
      # ici-next does not build (ici never builds): the workspace declares
      # build trees and this job owns them. build/ici-main carries coverage
      # instrumentation for the C++ gate; build/ici-static is the Qt-free
      # release artifact the static-cli workspace reads.
      - name: Build the viewer dogfood trees
        working-directory: viewer
        run: |
          set -euo pipefail
          cmake -S . -B build/ici-main \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/ici-main --parallel
          cmake -S . -B build/ici-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DICIRV_BUILD_GUI=OFF -DICIRV_STATIC=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/ici-static --target icirv --parallel

      - name: 🐶 Dogfooding — static CLI artifact contract via ici (viewer/)
        working-directory: viewer
        run: |
          set -euo pipefail
          ../dist/ici.pyz verify --config ici-static-cli.toml --profile deep \
            --result static_cli_result.json
          ../dist/ici.pyz report --result static_cli_result.json \
            --out static_cli_report.html
          # The check reports ABI facts; the static-linkage floor itself is
          # not declarable yet, so it is asserted here instead of assumed.
          ! readelf -d build/ici-static/icirv | grep -q 'NEEDED.*Qt'

      - name: 🐶 Dogfooding — C++ Gate via ici (viewer/)
        working-directory: viewer
        env:
          # The adapter executes every CTest, including the QWidget-based
          # MainWindow test. GitHub-hosted runners do not provide a display.
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ../dist/ici.pyz verify --result verify_report.json
          ../dist/ici.pyz report --result verify_report.json --out verify_report.html
          python "$GITHUB_WORKSPACE/scripts/check_next_floors.py" \
            --set=viewer verify_report.json

      # The unit suite exercises the next path from source; this exercises it
      # from the shipped artifact. The fixture is a committed next-schema
      # project with no interpreter of its own, so the interpreter-dependent
      # checks stay out of scope and the run must come back clean — a next
      # path that cannot reach exit 0 from dist/ici.pyz fails here, not in a
      # bug report.
      - name: 🐶 Dogfooding — next path via dist/ici.pyz
        working-directory: tests/fixtures/next-self-verify
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          "$GITHUB_WORKSPACE/dist/ici.pyz" plan
          "$GITHUB_WORKSPACE/dist/ici.pyz" verify --result "$out/result.json"
          "$GITHUB_WORKSPACE/dist/ici.pyz" report --result "$out/result.json" --out "$out/result.html"
          test -s "$out/result.json" && test -s "$out/result.html"
          # Zero-CDN on the produced page, not on a promise (SPEC-04).
          ! grep -qE 'https?://' "$out/result.html"
          cp "$out/result.json" next_self_result.json
          cp "$out/result.html" next_self_result.html

      # A trend artifact, not a gate. Wall clock on a shared runner moves for
      # reasons that have nothing to do with the reporters, so --enforce stays
      # off here and the recorded budgets are read from the artifact instead.
      - name: Large-report reporter benchmark (trend artifact)
        if: always()
        run: |
          uv run --python 3.10 python scripts/benchmark_report.py \
            --json report_benchmark.json

      - name: Upload Verification Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ici-verification-report
          path: |
            verify_report.html
            verify_report.json
            verify_report.sarif
            viewer/verify_report.html
            viewer/verify_report.json
            viewer/static_cli_report.html
            viewer/static_cli_result.json
            tests/fixtures/next-self-verify/next_self_result.json
            tests/fixtures/next-self-verify/next_self_result.html
            report_benchmark.json
          retention-days: 14

  # The Qt shell sits outside every ici engine's scope by design — the core is
  # what gets verified — so nothing else would notice a broken GUI build.
  viewer-gui:
    name: Viewer GUI build (Qt${{ matrix.qt_major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_major: 6
            packages: qt6-base-dev
            cmake_args: ""
          - qt_major: 5
            packages: qtbase5-dev
            cmake_args: -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt ${{ matrix.qt_major }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      # This configures after Qt is installed, but explicitly disables both
      # package families. ICIRV_BUILD_GUI=OFF must not probe or link either one.
      - name: Verify the Qt-free static CLI contract
        if: matrix.qt_major == 6
        working-directory: viewer
        run: |
          set -euo pipefail
          cmake -S . -B build/cli-no-qt \
            -DCMAKE_BUILD_TYPE=Release \
            -DICIRV_BUILD_GUI=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON
          cmake --build build/cli-no-qt --target icirv --parallel
          if ldd build/cli-no-qt/icirv 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::Qt-free icirv is not statically linked"
            ldd build/cli-no-qt/icirv || true
            exit 1
          fi

      - name: Configure, build, and test Qt ${{ matrix.qt_major }}
        working-directory: viewer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build/gui -DCMAKE_BUILD_TYPE=Release \
            -DICIRV_BUILD_GUI=ON ${{ matrix.cmake_args }}
          cmake --build build/gui --parallel
          ctest --test-dir build/gui --output-on-failure

      # Loads a real report headlessly, so a GUI that links but dies on startup
      # or while parsing still fails the gate.
      - name: Headless smoke run
        working-directory: viewer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ./build/gui/src/gui/icirv-gui "$PWD/tests/data/ici_self_report.json" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::viewer GUI exited before the smoke window elapsed"
            wait "$pid" || true
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "viewer GUI stayed up through a report load"

  report-pr:
    name: Publish PR Report & Sticky Comment
    # Publish a generated failure report too. `always()` is required because a
    # quality gate can return non-zero after writing the report artifact.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [verify, viewer-gui]
    runs-on: ubuntu-latest
    concurrency:
      group: ici-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write       # gh-pages 업로드 (Contents API)
      pull-requests: write  # sticky 댓글 작성/갱신
      pages: read           # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      # PR head가 아닌 base(병합 대상 main)를 체크아웃한다: 이 job은
      # contents:write + pull-requests:write 를 가진 신뢰된 job이므로, 여기서
      # 빌드해 실행하는 dist/ici.pyz는 신뢰된 코드에서만 나와야 한다. PR이
      # 실제로 검증된 내용(verify_report.html/json)은 verify job의 아티팩트로만
      # 받으므로, PR 소스 자체를 이 job에서 체크아웃할 필요가 없다.
      - name: Checkout Trusted Base Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      - name: Download Verification Reports (artifact)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ici-verification-report
          path: .

      # Both reports get published. This repository verifies two things — the
      # Python package at the root and the C++ viewer under viewer/ — and a
      # comment carrying only the first hides half the gate. Each workspace
      # publishes under its own label (``ici`` and ``icirv``), so each keeps
      # its own sticky comment on the PR.
      - name: Publish HTML Reports & Sticky PR Comment
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz publish --result verify_report.json --out verify_report.html
          (cd viewer && ../dist/ici.pyz publish --result verify_report.json --out verify_report.html)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A successful Contents API write does not mean the report is visible or
      # that the comment write succeeded. GitHub Pages builds asynchronously,
      # so poll the URLs from the actual sticky comment with a cache-busting
      # query before this job is allowed to pass.
      - name: Verify Sticky Comment & Published HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REPORTS: "2"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          expected = int(os.environ["EXPECTED_REPORTS"])
          comments_url = f"{api}/repos/{repo}/issues/{pr}/comments"

          def read(url, *, api_request=False):
              headers = {"User-Agent": "ici-report-verifier"}
              if api_request:
                  headers.update({
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read()

          bodies: list[str] = []
          for page in range(1, 21):
              comments = json.loads(read(f"{comments_url}?per_page=100&page={page}", api_request=True))
              bodies.extend(
                  str(item.get("body", "")) for item in comments
                  if "<!-- ici-next:" in str(item.get("body", ""))
              )
              if len(comments) < 100:
                  break
          if not bodies:
              raise SystemExit("ici sticky comment was not found")
          run_path = f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          if not all(run_path in body for body in bodies):
              raise SystemExit("an ici sticky comment is stale: current workflow run link is missing")
          urls = list(dict.fromkeys(
              url for body in bodies
              for url in re.findall(r"^report: (https://\S+)", body, flags=re.M)
          ))
          if len(urls) != expected:
              raise SystemExit(f"expected {expected} report links in the sticky comments, found {len(urls)}")

          pending = list(urls)
          last_errors = {}
          # Legacy Pages deployments may remain queued for several minutes when
          # consecutive report commits supersede one another. Keep the PR gate
          # fail-closed, but allow the deployment up to ten minutes to settle.
          for attempt in range(120):
              remaining = []
              for url in pending:
                  separator = "&" if "?" in url else "?"
                  probe = f"{url}{separator}ici_run={os.environ['GITHUB_RUN_ID']}-{attempt}"
                  try:
                      payload = read(probe).lstrip().lower()
                      if b"<!doctype html" not in payload[:256] and b"<html" not in payload[:256]:
                          raise RuntimeError("response is not HTML")
                  except (OSError, RuntimeError, urllib.error.HTTPError) as exc:
                      last_errors[url] = str(exc)
                      remaining.append(url)
              if not remaining:
                  print(f"verified sticky comment and {len(urls)} published HTML report(s)")
                  break
              pending = remaining
              time.sleep(5)
          else:
              raise SystemExit(f"published report URLs did not become ready: {last_errors}")
          PY

  publish-main:
    name: Publish Main Verification Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, viewer-gui]
    runs-on: ubuntu-latest
    concurrency:
      group: ici-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read       # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      - name: Checkout Main Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      # Consumes the verify job's artifacts rather than re-running verify. The
      # push is on main, so those artifacts already come from trusted code, and
      # re-running would mean building the C++ gate a second time — Qt, gcov and
      # the sanitizers — for a result this run already has.
      #
      # Each workspace publishes under its own label, so the destinations —
      # ici/<label>/<ref>/<sha>/index.html — never collide on main either.
      - name: Download Verification Reports (artifact)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ici-verification-report
          path: .

      - name: Publish Trusted Main Verification Reports
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz publish --result verify_report.json --out verify_report.html
          (cd viewer && ../dist/ici.pyz publish --result verify_report.json --out verify_report.html)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-gate:
    name: Merge Gate
    if: ${{ always() }}
    needs: [verify, viewer-gui, report-pr]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Require verification, GUI, and PR report publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VIEWER_GUI_RESULT: ${{ needs.viewer-gui.result }}
          REPORT_RESULT: ${{ needs.report-pr.result }}
        run: |
          set -euo pipefail
          test "$VERIFY_RESULT" = success || {
            echo "::error::Verify & Dogfood ici result: $VERIFY_RESULT"
            exit 1
          }
          test "$VIEWER_GUI_RESULT" = success || {
            echo "::error::Qt6 Viewer GUI build result: $VIEWER_GUI_RESULT"
            exit 1
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$REPORT_RESULT" = success || {
              echo "::error::Publish PR Report & Sticky Comment result: $REPORT_RESULT"
              exit 1
            }
          fi
          echo "All required CI jobs passed"
