name: CI Quality Gate (Dogfooding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  verify:
    name: Verify & Dogfood ici
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Code Style & Lint Check
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Unit Tests & Coverage
        run: |
          uv run --python 3.10 pytest -v

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh

      - name: Run Isolated Smoke Test
        run: |
          ./scripts/smoke.sh

      - name: 🐶 Dogfooding — Self-Verification Gate via ici
        run: |
          chmod +x dist/ici.pyz
          dist/ici.pyz verify --report --html verify_report.html --github-summary
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Upload Verification Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ici-verification-report
          path: |
            verify_report.html
            verify_report.json
          retention-days: 14
