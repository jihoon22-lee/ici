name: CI Quality Gate (Dogfooding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Dogfood ici
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The development harness (ledger, candidate audit, Quality Zoo runner)
      # and the project interpreter the root dogfood inspects run on 3.10.
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      # The harness venv is the project environment of this repository: the
      # root dogfood resolves its Ruff from PATH and its interpreter from .venv.
      - name: Harness Environment, Ruff Lint and Format
        run: |
          uv sync --frozen --python 3.10
          uv run --frozen --python 3.10 ruff check .
          uv run --frozen --python 3.10 ruff format --check .
          test -x "$GITHUB_WORKSPACE/.venv/bin/python"
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Repository-asset contracts: the candidate Merge Gate audit, the fixture
      # register, corpus hygiene and the workflow shape this file must keep.
      - name: Repository asset unit tests
        run: |
          .venv/bin/python -m unittest discover -s scripts/tests -v

      # The corpus's own contract tests: runner/manifest/expectation integrity.
      - name: Quality Zoo corpus unit tests
        working-directory: quality-zoo
        run: |
          python3.10 -m unittest discover -s tests -v

      # viewer/src/gui is project source and is linted like the rest of it, so
      # the viewer dogfood needs Qt's headers — not to build a GUI, but to parse
      # one. qmake6 is a separate package from qt6-base-dev; clang-tidy and clazy
      # keep the C++ lint path non-skippable. cmake ships with the runner image.
      - name: Install the C++ toolchain for the viewer dogfood
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qmake6 pkg-config clang-tidy clazy

      - name: Pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustc --version

      # The product under test is the native binary built from this commit; no
      # Python product, worker or fallback exists (ADR-0008).
      - name: Build the native ici
        run: |
          set -euo pipefail
          cargo build --release --locked -p ici-cli
          ici="$GITHUB_WORKSPACE/target/release/ici"
          "$ici" --version
          printf 'ICI_BIN=%s\n' "$ici" >> "$GITHUB_ENV"

      - name: 🐶 Dogfooding — Self-Verification Gate via native ici
        run: |
          set -euo pipefail
          "$ICI_BIN" verify --report --html verify_report.html --github-summary
          # Zero-CDN on the produced page, not on a promise.
          ! grep -qiE '<(script|link)[^>]+(src|href)="https?://' verify_report.html

      # The viewer-gui job proves a configure-time property ici cannot express:
      # the CLI configures with both Qt package families disabled. This proves
      # the other half — the linkage policy of the produced binary, from ici's
      # own readelf evidence — so the release asset's static contract is a
      # measurement in a report rather than a grep in a shell script.
      #
      # It runs before the C++ gate because --report writes a fixed filename,
      # and the C++ gate's report is the one that keeps the canonical name.
      - name: 🐶 Dogfooding — static CLI artifact contract via native ici (viewer/)
        working-directory: viewer
        env:
          ICI_CONFIG: ici-static-cli.toml
        run: |
          set -euo pipefail
          "$ICI_BIN" verify --profile deep --report
          mv verify_report.json static_cli_report.json

      # viewer/ is a pure C++17 core that builds without Qt. This step runs
      # ici's C++ path for real in CI: g++ diagnostics, gcov coverage,
      # ASan/UBSan and include cycles. --github-summary appends to the step
      # summary, so the root result and the C++ result sit side by side.
      - name: 🐶 Dogfooding — C++ Gate via native ici (viewer/)
        working-directory: viewer
        env:
          # The adapter executes every CTest, including the QWidget-based
          # MainWindow test. GitHub-hosted runners do not provide a display.
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          "$ICI_BIN" verify --report --html verify_report.html --github-summary
          ! grep -qiE '<(script|link)[^>]+(src|href)="https?://' verify_report.html

      - name: Upload Verification Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ici-verification-report
          path: |
            verify_report.html
            verify_report.json
            viewer/verify_report.html
            viewer/verify_report.json
            viewer/static_cli_report.json
          retention-days: 14

  # The product gate (ADR-0008). Tests that need external tools are `#[ignore]`d
  # explicit gates; this job runs the ordinary suite with the project
  # interpreter some CLI tests expect at .venv/bin/python (the dev harness).
  rust:
    name: Rust workspace (fmt, Clippy, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Over a hundred test binaries with full debuginfo fill the runner disk and the linker dies
    # with SIGBUS. Tests do not need debuginfo; incremental state is wasted on a one-shot build.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"

    steps:
      # Full history: the migration ledger check reads the frozen oracle commit with git archive.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      # Fragment closure evidence and the oracle import closure must match the frozen source.
      - name: Migration ledger
        run: |
          python3 scripts/rust_migration_inventory.py --self-test
          python3 scripts/rust_migration_inventory.py --check --require-closed

      - name: Project interpreter for CLI tests
        run: uv sync --frozen --python 3.10

      - name: Pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version

      # Non-ignored C++ build tests run the real Qt5 (/usr/bin/qmake via qtchooser) and
      # Qt6 qmake, pkg-config and clang-tidy. Frozen-replay tests run under PATH=/usr/bin:/bin,
      # where the runner image's own cmake (/usr/local/bin) is not visible, so the distribution
      # cmake is installed there too; g++ ships with the runner image.
      - name: Install the C++ toolchain for the native build tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qt6-base-dev qmake6 pkg-config clang-tidy clazy cmake
          /usr/bin/cmake --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --no-fail-fast reports every failing test binary in one run.
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

  # The Qt shell sits outside every ici engine's scope by design — the core is
  # what gets verified — so nothing else would notice a broken GUI build.
  viewer-gui:
    name: Viewer GUI build (Qt${{ matrix.qt_major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_major: 6
            packages: qt6-base-dev
            cmake_args: ""
          - qt_major: 5
            packages: qtbase5-dev
            cmake_args: -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt ${{ matrix.qt_major }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      # This configures after Qt is installed, but explicitly disables both
      # package families. ICIRV_BUILD_GUI=OFF must not probe or link either one.
      - name: Verify the Qt-free static CLI contract
        if: matrix.qt_major == 6
        working-directory: viewer
        run: |
          set -euo pipefail
          cmake -S . -B build/cli-no-qt \
            -DCMAKE_BUILD_TYPE=Release \
            -DICIRV_BUILD_GUI=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON
          cmake --build build/cli-no-qt --target icirv --parallel
          if ldd build/cli-no-qt/icirv 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::Qt-free icirv is not statically linked"
            ldd build/cli-no-qt/icirv || true
            exit 1
          fi

      - name: Configure, build, and test Qt ${{ matrix.qt_major }}
        working-directory: viewer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build/gui -DCMAKE_BUILD_TYPE=Release \
            -DICIRV_BUILD_GUI=ON ${{ matrix.cmake_args }}
          cmake --build build/gui --parallel
          ctest --test-dir build/gui --output-on-failure

      # Loads a real report headlessly, so a GUI that links but dies on startup
      # or while parsing still fails the gate.
      - name: Headless smoke run
        working-directory: viewer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ./build/gui/src/gui/icirv-gui "$PWD/tests/data/ici_self_report.json" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::viewer GUI exited before the smoke window elapsed"
            wait "$pid" || true
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "viewer GUI stayed up through a report load"

  report-pr:
    name: Publish PR Report & Sticky Comment
    # Publish a generated failure report too. `always()` is required because a
    # quality gate can return non-zero after writing the report artifact.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [verify, viewer-gui]
    runs-on: ubuntu-latest
    concurrency:
      group: ici-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write       # gh-pages 업로드 (Contents API)
      pull-requests: write  # sticky 댓글 작성/갱신
      pages: read           # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      # PR head가 아닌 base(병합 대상 main)를 체크아웃한다: 이 job은
      # contents:write + pull-requests:write 를 가진 신뢰된 job이므로, 여기서
      # 빌드해 실행하는 native ici는 신뢰된 코드에서만 나와야 한다. PR이
      # 실제로 검증된 내용(verify_report.html/json)은 verify job의 아티팩트로만
      # 받으므로, PR 소스 자체를 이 job에서 체크아웃할 필요가 없다.
      - name: Checkout Trusted Base Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # Transitional guard for the R9 cutover PR itself: its trusted base (pre-cutover
      # main) has no Rust product to build. Then nothing is built or run — PR head code
      # is never checked out here — and the report is simply not published. Remove this
      # step and the step conditions that read it once main contains crates/ici-cli
      # (after the cutover merge).
      - name: Check the Trusted Base Has the Rust Product
        id: base
        run: |
          if [ -f crates/ici-cli/Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The trusted base predates the Rust product (no crates/ici-cli); the report is not published for this run."
          fi

      # Only the sticky-comment verifier below uses Python.
      - name: Set up Python 3.10
        if: steps.base.outputs.rust == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      # The binary leaves the checkout before the report artifact is unpacked
      # into it, so nothing from the artifact can replace what runs with the token.
      - name: Build the native ici from the trusted base
        if: steps.base.outputs.rust == 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --release --locked -p ici-cli
          mkdir -- "$RUNNER_TEMP/ici-trusted"
          install -m 0755 target/release/ici "$RUNNER_TEMP/ici-trusted/ici"
          "$RUNNER_TEMP/ici-trusted/ici" --version

      - name: Download Verification Reports (artifact)
        if: steps.base.outputs.rust == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ici-verification-report
          path: .

      # Both reports in one comment. This repository verifies two things — the
      # repository root and the C++ viewer under viewer/ — and a comment
      # carrying only the first hides half the gate. The root needs an explicit
      # label because its directory name is ".".
      - name: Publish HTML Reports & Sticky PR Comment
        if: steps.base.outputs.rust == 'true'
        run: |
          "$RUNNER_TEMP/ici-trusted/ici" publish --report-dir ici=. --report-dir viewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A successful Contents API write does not mean the report is visible or
      # that the comment write succeeded. GitHub Pages builds asynchronously,
      # so poll the URLs from the actual sticky comment with a cache-busting
      # query before this job is allowed to pass.
      - name: Verify Sticky Comment & Published HTML
        if: steps.base.outputs.rust == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REPORTS: "2"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          expected = int(os.environ["EXPECTED_REPORTS"])
          comments_url = f"{api}/repos/{repo}/issues/{pr}/comments"

          def read(url, *, api_request=False):
              headers = {"User-Agent": "ici-report-verifier"}
              if api_request:
                  headers.update({
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read()

          body = ""
          for page in range(1, 21):
              comments = json.loads(read(f"{comments_url}?per_page=100&page={page}", api_request=True))
              body = next(
                  (str(item.get("body", "")) for item in comments if "<!-- ici-report -->" in str(item.get("body", ""))),
                  "",
              )
              if body or len(comments) < 100:
                  break
          if not body:
              raise SystemExit("ici sticky comment was not found")
          run_path = f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          if run_path not in body:
              raise SystemExit("ici sticky comment is stale: current workflow run link is missing")
          urls = list(dict.fromkeys(re.findall(r"\[📊 열기\]\((https://[^)]+)\)", body)))
          if len(urls) != expected:
              raise SystemExit(f"expected {expected} report links in the sticky comment, found {len(urls)}")

          pending = list(urls)
          last_errors = {}
          # Legacy Pages deployments may remain queued for several minutes when
          # consecutive report commits supersede one another. Keep the PR gate
          # fail-closed, but allow the deployment up to ten minutes to settle.
          for attempt in range(120):
              remaining = []
              for url in pending:
                  separator = "&" if "?" in url else "?"
                  probe = f"{url}{separator}ici_run={os.environ['GITHUB_RUN_ID']}-{attempt}"
                  try:
                      payload = read(probe).lstrip().lower()
                      if b"<!doctype html" not in payload[:256] and b"<html" not in payload[:256]:
                          raise RuntimeError("response is not HTML")
                  except (OSError, RuntimeError, urllib.error.HTTPError) as exc:
                      last_errors[url] = str(exc)
                      remaining.append(url)
              if not remaining:
                  print(f"verified sticky comment and {len(urls)} published HTML report(s)")
                  break
              pending = remaining
              time.sleep(5)
          else:
              raise SystemExit(f"published report URLs did not become ready: {last_errors}")
          PY

  publish-main:
    name: Publish Main Verification Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, viewer-gui]
    runs-on: ubuntu-latest
    concurrency:
      group: ici-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read       # Pages 활성화 여부 조회 (뷰어 링크 계산용)

    steps:
      - name: Checkout Main Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Transitional guard, same as report-pr: a main commit without crates/ici-cli
      # (pre-cutover) has no Rust product to build, so nothing is built or run and
      # the report is not published. Remove this step and the step conditions that
      # read it after the cutover merge.
      - name: Check the Trusted Base Has the Rust Product
        id: base
        run: |
          if [ -f crates/ici-cli/Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The trusted base predates the Rust product (no crates/ici-cli); the report is not published for this run."
          fi

      # The binary leaves the checkout before the report artifact is unpacked
      # into it, so nothing from the artifact can replace what runs with the token.
      - name: Build the native ici from main
        if: steps.base.outputs.rust == 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --release --locked -p ici-cli
          mkdir -- "$RUNNER_TEMP/ici-trusted"
          install -m 0755 target/release/ici "$RUNNER_TEMP/ici-trusted/ici"
          "$RUNNER_TEMP/ici-trusted/ici" --version

      # Consumes the verify job's artifacts rather than re-running verify. The
      # push is on main, so those artifacts already come from trusted code, and
      # re-running would mean building the C++ gate a second time — Qt, gcov and
      # the sanitizers — for a result this run already has.
      #
      # It also has to be --report-dir: on main the published path is
      # main/index.html with no project prefix, so publishing the root and the
      # viewer separately would have them overwrite each other.
      - name: Download Verification Reports (artifact)
        if: steps.base.outputs.rust == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ici-verification-report
          path: .

      - name: Publish Trusted Main Verification Reports
        if: steps.base.outputs.rust == 'true'
        run: |
          "$RUNNER_TEMP/ici-trusted/ici" publish --report-dir ici=. --report-dir viewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-gate:
    name: Merge Gate
    if: ${{ always() }}
    needs: [verify, rust, viewer-gui, report-pr]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # Every required job must be `success`: failure, cancelled and skipped all stop the gate.
      - name: Require verification, the Rust workspace, GUI, and PR report publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          VIEWER_GUI_RESULT: ${{ needs.viewer-gui.result }}
          REPORT_RESULT: ${{ needs.report-pr.result }}
        run: |
          set -euo pipefail
          test "$VERIFY_RESULT" = success || {
            echo "::error::Verify & Dogfood ici result: $VERIFY_RESULT"
            exit 1
          }
          test "$RUST_RESULT" = success || {
            echo "::error::Rust workspace (fmt, Clippy, tests) result: $RUST_RESULT"
            exit 1
          }
          test "$VIEWER_GUI_RESULT" = success || {
            echo "::error::Qt6 Viewer GUI build result: $VIEWER_GUI_RESULT"
            exit 1
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$REPORT_RESULT" = success || {
              echo "::error::Publish PR Report & Sticky Comment result: $REPORT_RESULT"
              exit 1
            }
          fi
          echo "All required CI jobs passed"
