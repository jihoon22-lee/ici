name: Verify ici Candidate with Quality Zoo

on:
  workflow_dispatch:
    inputs:
      ici_target_sha:
        description: "Exact protected ici main commit packaged by the candidate producer"
        required: true
        type: string
      candidate_artifact_id:
        description: "Actions artifact ID of ici-native-candidate-<sha> from candidate-artifact.yml"
        required: true
        type: string
      candidate_archive_sha256:
        description: "Out-of-band SHA-256 of ici-<version>-x86_64-unknown-linux-musl.tar.gz"
        required: true
        type: string
      corpus_sha:
        description: "Exact ici commit whose quality-zoo/ tree supplies the expectations"
        required: true
        type: string
      corpus_revision_mode:
        description: "Corpus revision source: protected main tip or an open same-repository PR head"
        required: false
        default: main
        type: choice
        options:
          - main
          - pull_request
      corpus_pr_number:
        description: "Open same-repository ici PR number (required in pull_request mode)"
        required: false
        type: string

permissions: {}

concurrency:
  group: quality-zoo-candidate-${{ inputs.ici_target_sha }}-${{ inputs.corpus_revision_mode }}-${{ inputs.corpus_pr_number }}-${{ inputs.corpus_sha }}
  cancel-in-progress: false

jobs:
  # Native Rust candidate (ADR-0008). Selectors bind expectations to an exact ici
  # executable digest, so a fresh native build is first bound, in this job's
  # throwaway corpus checkout, to the frozen v0.13.0 answers by
  # runner.bind_candidate: only producer_version changes; every predicate is
  # the v0.13.0 known answer, and the reviewed per-format override in
  # runner/candidate_overrides.py is the only accepted native difference.
  # Nothing is committed. Any remaining parity gap fails this job.
  accept-native:
    name: Verify Native Candidate against Quality Zoo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
      # SHA-256 of the public v0.13.0 ici.pyz: the frozen oracle whose answers bind.
      REFERENCE_SHA256: c179986f3d0eac110cf436a961458e56c0f4a218517e9883ff47cd67addc1cde

    steps:
      - name: Checkout Trusted Candidate Helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ici-workflow
          sparse-checkout: scripts/candidate_merge_gate.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Exact Quality Zoo Corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.corpus_sha }}
          path: corpus
          sparse-checkout: quality-zoo
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install C++ and Qt analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy clazy cmake g++ pkg-config qt6-base-dev

      - name: Validate Workflow Inputs and Exact Revisions
        env:
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CORPUS_SHA: ${{ inputs.corpus_sha }}
          CORPUS_REVISION_MODE: ${{ inputs.corpus_revision_mode }}
          CORPUS_PR_NUMBER: ${{ inputs.corpus_pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jihoon22-lee/ici"
          test "$GITHUB_REF" = "refs/heads/main"
          printf '%s' "$ICI_TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CANDIDATE_ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$CORPUS_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CORPUS_REVISION_MODE" | grep -Eq '^(main|pull_request)$'
          test "$(git -C corpus rev-parse HEAD)" = "$CORPUS_SHA"
          ici_main="$(git ls-remote --exit-code https://github.com/jihoon22-lee/ici.git refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" = "$ici_main"
          case "$CORPUS_REVISION_MODE" in
            main)
              test -z "$CORPUS_PR_NUMBER"
              test "$CORPUS_SHA" = "$ici_main"
              printf '{"repository":"jihoon22-lee/ici","revision_mode":"main","schema_version":"ici.quality-zoo-corpus-revision/v1","target_sha":"%s"}\n' \
                "$CORPUS_SHA" > "$RUNNER_TEMP/corpus-revision.json"
              ;;
            pull_request)
              printf '%s' "$CORPUS_PR_NUMBER" | grep -Eq '^[1-9][0-9]{0,18}$'
              corpus_repository="jihoon22-lee/ici"
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/${corpus_repository}/pulls/${CORPUS_PR_NUMBER}" \
                > "$RUNNER_TEMP/corpus-pull-request.json"
              python3.10 ici-workflow/scripts/candidate_merge_gate.py verify-pr \
                "$RUNNER_TEMP/corpus-pull-request.json" \
                "$CORPUS_PR_NUMBER" "$CORPUS_SHA" "$corpus_repository" \
                > "$RUNNER_TEMP/corpus-revision.json"
              ;;
          esac

      - name: Download Exact Native Candidate and Provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/candidate-evidence"
          mkdir -- "$evidence"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" \
            > "$evidence/artifact.json"
          test "$(jq -r '.name' "$evidence/artifact.json")" = "ici-native-candidate-$ICI_TARGET_SHA"
          test "$(jq -r '.workflow_run.head_sha' "$evidence/artifact.json")" = "$ICI_TARGET_SHA"
          run_id="$(jq -r '.workflow_run.id' "$evidence/artifact.json")"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$evidence/candidate-run.json"
          jq -e --arg sha "$ICI_TARGET_SHA" \
            '.path == ".github/workflows/candidate-artifact.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .head_sha == $sha' \
            "$evidence/candidate-run.json" > /dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/native-candidate.zip"
          mkdir -- "$RUNNER_TEMP/native-candidate"
          unzip -q "$RUNNER_TEMP/native-candidate.zip" -d "$RUNNER_TEMP/native-candidate"
          mapfile -t archives < <(find "$RUNNER_TEMP/native-candidate" -maxdepth 1 -type f -name 'ici-*-x86_64-unknown-linux-musl.tar.gz')
          test "${#archives[@]}" = 1
          printf '%s  %s\n' "$CANDIDATE_ARCHIVE_SHA256" "${archives[0]}" | sha256sum --check --strict
          printf 'NATIVE_ARCHIVE=%s\n' "${archives[0]}" >> "$GITHUB_ENV"

      - name: Intake and Bind Native Candidate without Credentials
        env:
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        working-directory: corpus/quality-zoo
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python3.10 -m runner.native_intake \
            --archive "$NATIVE_ARCHIVE" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --destination "$RUNNER_TEMP/native-verified" > "$RUNNER_TEMP/native-intake.json"
          jq -e --arg sha "$ICI_TARGET_SHA" \
            '.source_revision == $sha and .development_snapshot == false and .target == "x86_64-unknown-linux-musl"' \
            "$RUNNER_TEMP/native-intake.json" > /dev/null
          executable="$(jq -r '.executable' "$RUNNER_TEMP/native-intake.json")"
          if [[ -e candidate-manifest.json || -L candidate-manifest.json ]]; then
            [[ -f candidate-manifest.json && ! -L candidate-manifest.json ]]
            manifest=candidate-manifest.json
          else
            [[ -f manifest.json && ! -L manifest.json ]]
            manifest=manifest.json
          fi
          python3.10 -m runner.bind_candidate \
            --manifest "$manifest" \
            --reference-sha256 "$REFERENCE_SHA256" \
            --ici-bin "$executable" \
            --name "candidate-native-${ICI_TARGET_SHA:0:12}" > "$RUNNER_TEMP/native-bind.json"
          {
            printf 'NATIVE_EXECUTABLE=%s\n' "$executable"
            printf 'NATIVE_MANIFEST=%s\n' "$manifest"
          } >> "$GITHUB_ENV"

      - name: Run Quality Zoo against the Native Candidate
        working-directory: corpus/quality-zoo
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          # Record which external tools this runner resolves; native intake
          # extracts only bin/ici, so project tools come from this PATH.
          for tool in python3.10 ruff ty mypy g++ clang clang-tidy clazy-standalone clazy cmake qmake6 pkg-config; do
            printf '%s\t%s\n' "$tool" "$(command -v "$tool" || echo unavailable)"
          done > "$RUNNER_TEMP/native-tool-inventory.tsv"
          ICI_PYTHON=python3.10 python3.10 -m runner.run \
            --manifest "$NATIVE_MANIFEST" \
            --ici-bin "$NATIVE_EXECUTABLE" \
            --output-dir "$RUNNER_TEMP/quality-zoo-results" \
            --timeout-seconds 900 || status=$?
          python3.10 - "$RUNNER_TEMP/quality-zoo-results/suite.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("schema") != "quality-zoo.suite/v1":
              raise SystemExit("unexpected Quality Zoo suite schema")
          results = payload.get("results")
          if not isinstance(results, list) or not results:
              raise SystemExit("Quality Zoo returned no scenarios")
          if payload.get("scenario_count") != len(results):
              raise SystemExit("Quality Zoo scenario count differs")
          if payload.get("contract_verdict") != "PASS":
              raise SystemExit("Quality Zoo native candidate contract did not pass")
          if any(item.get("errors") for item in results if isinstance(item, dict)):
              raise SystemExit("Quality Zoo native result contains runner errors")
          PY
          test "${status:-0}" = 0

      - name: Stage Native Candidate Acceptance Evidence
        if: always()
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/native-acceptance"
          mkdir -- "$destination"
          for file in native-intake.json native-bind.json native-tool-inventory.tsv corpus-revision.json; do
            if [ -f "$RUNNER_TEMP/$file" ]; then cp -- "$RUNNER_TEMP/$file" "$destination/"; fi
          done
          if [ -d "$RUNNER_TEMP/candidate-evidence" ]; then cp -R -- "$RUNNER_TEMP/candidate-evidence" "$destination/github-evidence"; fi
          if [ -d "$RUNNER_TEMP/quality-zoo-results" ]; then cp -R -- "$RUNNER_TEMP/quality-zoo-results" "$destination/results"; fi

      - name: Upload Native Candidate Acceptance Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-zoo-native-candidate-${{ inputs.ici_target_sha }}-${{ inputs.corpus_sha }}
          path: ${{ runner.temp }}/native-acceptance
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
