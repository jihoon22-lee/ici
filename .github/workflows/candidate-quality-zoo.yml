name: Verify ici Candidate with Quality Zoo

on:
  workflow_dispatch:
    inputs:
      ici_target_sha:
        description: "Exact protected ici main commit packaged by the candidate producer"
        required: true
        type: string
      candidate_artifact_id:
        description: "Actions artifact ID for the provenance-bound candidate ZIP"
        required: true
        type: string
      candidate_archive_sha256:
        description: "Out-of-band SHA-256 of the raw candidate artifact ZIP"
        required: true
        type: string
      toy_target_sha:
        description: "Exact toy-projects commit containing candidate expectations (main or PR head)"
        required: true
        type: string
      toy_revision_mode:
        description: "Toy revision source: protected main tip or an open same-repository PR head"
        required: false
        default: main
        type: choice
        options:
          - main
          - pull_request
      toy_pr_number:
        description: "Open same-repository toy-projects PR number (required in pull_request mode)"
        required: false
        type: string

permissions: {}

concurrency:
  group: quality-zoo-candidate-${{ inputs.ici_target_sha }}-${{ inputs.toy_revision_mode }}-${{ inputs.toy_pr_number }}-${{ inputs.toy_target_sha }}
  cancel-in-progress: false

jobs:
  accept:
    name: Verify Candidate against Quality Zoo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Trusted Candidate Helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ici-workflow
          sparse-checkout: scripts/candidate_merge_gate.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Exact Quality Zoo Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jihoon22-lee/toy-projects
          ref: ${{ inputs.toy_target_sha }}
          path: toy-projects
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install C++ and Qt analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy clazy cmake g++ pkg-config qt6-base-dev

      - name: Validate Workflow Inputs and Exact Revisions
        env:
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          TOY_TARGET_SHA: ${{ inputs.toy_target_sha }}
          TOY_REVISION_MODE: ${{ inputs.toy_revision_mode }}
          TOY_PR_NUMBER: ${{ inputs.toy_pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jihoon22-lee/ici"
          test "$GITHUB_REF" = "refs/heads/main"
          printf '%s' "$ICI_TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CANDIDATE_ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$TOY_TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$TOY_REVISION_MODE" | grep -Eq '^(main|pull_request)$'
          test "$(git -C toy-projects rev-parse HEAD)" = "$TOY_TARGET_SHA"
          ici_main="$(git ls-remote --exit-code https://github.com/jihoon22-lee/ici.git refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" = "$ici_main"
          case "$TOY_REVISION_MODE" in
            main)
              test -z "$TOY_PR_NUMBER"
              toy_main="$(git ls-remote --exit-code https://github.com/jihoon22-lee/toy-projects.git refs/heads/main | cut -f1)"
              test "$TOY_TARGET_SHA" = "$toy_main"
              printf '{"repository":"jihoon22-lee/toy-projects","revision_mode":"main","schema_version":"ici.quality-zoo-toy-revision/v1","target_sha":"%s"}\n' \
                "$TOY_TARGET_SHA" > "$RUNNER_TEMP/toy-revision.json"
              ;;
            pull_request)
              printf '%s' "$TOY_PR_NUMBER" | grep -Eq '^[1-9][0-9]{0,18}$'
              toy_repository="jihoon22-lee/toy-projects"
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/${toy_repository}/pulls/${TOY_PR_NUMBER}" \
                > "$RUNNER_TEMP/toy-pull-request.json"
              python3.10 ici-workflow/scripts/candidate_merge_gate.py verify-toy-pr \
                "$RUNNER_TEMP/toy-pull-request.json" \
                "$TOY_PR_NUMBER" "$TOY_TARGET_SHA" "$toy_repository" \
                > "$RUNNER_TEMP/toy-revision.json"
              ;;
          esac

      - name: Download Exact Candidate Archive and Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir -- "$RUNNER_TEMP/candidate-evidence"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" \
            > "$RUNNER_TEMP/candidate-evidence/artifact.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/candidate.zip"
          printf '%s  %s\n' "$CANDIDATE_ARCHIVE_SHA256" "$RUNNER_TEMP/candidate.zip" \
            | sha256sum --check --strict

      - name: Preflight Candidate without Credentials
        id: preflight
        env:
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        working-directory: toy-projects/quality-zoo
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python3.10 -m runner.candidate_intake \
            --archive "$RUNNER_TEMP/candidate.zip" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$ICI_TARGET_SHA" \
            --destination "$RUNNER_TEMP/candidate-preflight" \
            --json > "$RUNNER_TEMP/candidate-preflight.json"
          python3.10 - "$RUNNER_TEMP/candidate-preflight/candidate-provenance.json" \
            "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          output = Path(sys.argv[2])
          names = (
              "candidate_run_id",
              "merge_gate_check_run_id",
              "merge_gate_job_id",
              "merge_gate_run_id",
          )
          with output.open("a", encoding="utf-8") as stream:
              for name in names:
                  value = payload[name]
                  if type(value) is not int or value < 1:
                      raise SystemExit(f"invalid provenance ID: {name}")
                  stream.write(f"{name}={value}\n")
          PY

      - name: Fetch Authenticated GitHub Evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ steps.preflight.outputs.candidate_run_id }}
          MERGE_GATE_CHECK_RUN_ID: ${{ steps.preflight.outputs.merge_gate_check_run_id }}
          MERGE_GATE_JOB_ID: ${{ steps.preflight.outputs.merge_gate_job_id }}
          MERGE_GATE_RUN_ID: ${{ steps.preflight.outputs.merge_gate_run_id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/candidate-evidence"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > "$evidence/candidate-run.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/check-runs/${MERGE_GATE_CHECK_RUN_ID}" \
            > "$evidence/gate-check.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${MERGE_GATE_JOB_ID}" \
            > "$evidence/gate-job.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${MERGE_GATE_RUN_ID}" \
            > "$evidence/gate-run.json"

      - name: Select Candidate Quality Zoo Manifest
        id: select-manifest
        working-directory: toy-projects/quality-zoo
        run: |
          set -euo pipefail
          candidate_manifest="candidate-manifest.json"
          stable_manifest="manifest.json"
          if [[ -e "$candidate_manifest" || -L "$candidate_manifest" ]]; then
            if [[ ! -f "$candidate_manifest" || -L "$candidate_manifest" ]]; then
              echo "candidate-manifest.json must be a regular non-symlink file" >&2
              exit 1
            fi
            selected_manifest="$candidate_manifest"
            selected_source="candidate"
          elif [[ -e "$stable_manifest" || -L "$stable_manifest" ]]; then
            if [[ ! -f "$stable_manifest" || -L "$stable_manifest" ]]; then
              echo "manifest.json must be a regular non-symlink file" >&2
              exit 1
            fi
            selected_manifest="$stable_manifest"
            selected_source="stable-fallback"
          else
            echo "Quality Zoo has no supported manifest" >&2
            exit 1
          fi
          selected_sha256="$(sha256sum -- "$selected_manifest" | cut -d ' ' -f1)"
          {
            printf 'path=%s\n' "$selected_manifest"
            printf 'source=%s\n' "$selected_source"
            printf 'sha256=%s\n' "$selected_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Candidate Provenance and Run Quality Zoo
        env:
          ICI_TARGET_SHA: ${{ inputs.ici_target_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          MANIFEST_PATH: ${{ steps.select-manifest.outputs.path }}
          MANIFEST_SOURCE: ${{ steps.select-manifest.outputs.source }}
          MANIFEST_SHA256: ${{ steps.select-manifest.outputs.sha256 }}
        working-directory: toy-projects/quality-zoo
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python3.10 -m runner.candidate_intake \
            --archive "$RUNNER_TEMP/candidate.zip" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$ICI_TARGET_SHA" \
            --destination "$RUNNER_TEMP/candidate-verified" \
            --github-evidence "$RUNNER_TEMP/candidate-evidence" \
            --json > "$RUNNER_TEMP/candidate-intake.json"
          case "$MANIFEST_SOURCE:$MANIFEST_PATH" in
            candidate:candidate-manifest.json|stable-fallback:manifest.json) ;;
            *) echo "unexpected Quality Zoo manifest selection" >&2; exit 1 ;;
          esac
          test "$(sha256sum -- "$MANIFEST_PATH" | cut -d ' ' -f1)" = "$MANIFEST_SHA256"
          ICI_PYTHON=python3.10 python3.10 -m runner.run \
            --manifest "$MANIFEST_PATH" \
            --ici-bin "$RUNNER_TEMP/candidate-verified/ici.pyz" \
            --output-dir "$RUNNER_TEMP/quality-zoo-results" \
            --timeout-seconds 300
          test "$(sha256sum -- "$MANIFEST_PATH" | cut -d ' ' -f1)" = "$MANIFEST_SHA256"
          python3.10 - "$RUNNER_TEMP/quality-zoo-results/manifest-selection.json" \
            "$MANIFEST_PATH" "$MANIFEST_SOURCE" "$MANIFEST_SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, path, source, sha256 = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema": "quality-zoo.manifest-selection/v1",
                      "path": path,
                      "sha256": sha256,
                      "source": source,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          python3.10 - "$RUNNER_TEMP/quality-zoo-results/suite.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("schema") != "quality-zoo.suite/v1":
              raise SystemExit("unexpected Quality Zoo suite schema")
          results = payload.get("results")
          if not isinstance(results, list) or not results:
              raise SystemExit("Quality Zoo returned no scenarios")
          if payload.get("scenario_count") != len(results):
              raise SystemExit("Quality Zoo scenario count differs")
          if payload.get("contract_verdict") != "PASS":
              raise SystemExit("Quality Zoo candidate contract did not pass")
          if any(item.get("errors") for item in results if isinstance(item, dict)):
              raise SystemExit("Quality Zoo candidate result contains runner errors")
          PY

      - name: Stage Candidate Acceptance Evidence
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/candidate-acceptance"
          mkdir -- "$destination"
          cp -- "$RUNNER_TEMP/candidate-preflight.json" "$destination/preflight.json"
          cp -- "$RUNNER_TEMP/candidate-intake.json" "$destination/intake.json"
          cp -- "$RUNNER_TEMP/toy-revision.json" "$destination/toy-revision.json"
          cp -R -- "$RUNNER_TEMP/candidate-evidence" "$destination/github-evidence"
          cp -R -- "$RUNNER_TEMP/quality-zoo-results" "$destination/results"

      - name: Upload Candidate Acceptance Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-zoo-candidate-${{ inputs.ici_target_sha }}-${{ inputs.toy_target_sha }}
          path: ${{ runner.temp }}/candidate-acceptance
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
