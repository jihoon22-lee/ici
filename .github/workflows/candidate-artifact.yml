name: Build ici Candidate Artifact

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact protected-main commit to package (40 lowercase hex characters)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ici-candidate-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Candidate Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      target_sha: ${{ steps.provenance.outputs.target_sha }}
      merge_gate_check_run_id: ${{ steps.provenance.outputs.merge_gate_check_run_id }}
      merge_gate_job_id: ${{ steps.provenance.outputs.merge_gate_job_id }}
      merge_gate_run_id: ${{ steps.provenance.outputs.merge_gate_run_id }}
      merge_gate_run_attempt: ${{ steps.provenance.outputs.merge_gate_run_attempt }}
      merge_gate_job_url: ${{ steps.provenance.outputs.merge_gate_job_url }}
      merge_gate_url: ${{ steps.provenance.outputs.merge_gate_url }}
      candidate_workflow_definition_sha: ${{ steps.provenance.outputs.candidate_workflow_definition_sha }}

    steps:
      - name: Checkout Trusted Workflow Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Validate Exact Main Commit and Merge Gate
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "jihoon22-lee/ici"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! printf '%s' "$REQUESTED_TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::target_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [ "$REQUESTED_TARGET_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::target_sha must equal the protected-main dispatch commit"
            exit 1
          fi

          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${REQUESTED_TARGET_SHA}^{commit}"
          test "$(git rev-parse "${REQUESTED_TARGET_SHA}^{commit}")" = "$REQUESTED_TARGET_SHA"
          git merge-base --is-ancestor "$REQUESTED_TARGET_SHA" refs/remotes/origin/main

          checks_dir="$RUNNER_TEMP/candidate-check-pages"
          mkdir -- "$checks_dir"
          first_checks_page="$checks_dir/page-01.json"
          page_plan_json="$RUNNER_TEMP/candidate-page-plan.json"
          selection_json="$RUNNER_TEMP/candidate-selection.json"
          workflow_json="$RUNNER_TEMP/candidate-workflow-run.json"
          verified_json="$RUNNER_TEMP/candidate-verified-run.json"
          workflow_job_json="$RUNNER_TEMP/candidate-workflow-job.json"
          verified_job_json="$RUNNER_TEMP/candidate-verified-job.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${REQUESTED_TARGET_SHA}/check-runs?per_page=100&filter=all&page=1" \
            > "$first_checks_page"
          python3 scripts/candidate_merge_gate.py page-count \
            "$first_checks_page" > "$page_plan_json"
          page_count="$(python3 - "$page_plan_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["page_count"])
          PY
          )"
          check_pages=("$first_checks_page")
          for ((page = 2; page <= page_count; page++)); do
            printf -v page_file '%s/page-%02d.json' "$checks_dir" "$page"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${REQUESTED_TARGET_SHA}/check-runs?per_page=100&filter=all&page=${page}" \
              > "$page_file"
            check_pages+=("$page_file")
          done
          test "${#check_pages[@]}" = "$page_count"
          python3 scripts/candidate_merge_gate.py select-pages \
            "$REQUESTED_TARGET_SHA" "$GITHUB_REPOSITORY" "${check_pages[@]}" \
            > "$selection_json"
          merge_gate_run_id="$(python3 - "$selection_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["workflow_run_id"])
          PY
          )"
          merge_gate_check_run_id="$(python3 - "$selection_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["check_run_id"])
          PY
          )"
          merge_gate_job_id="$(python3 - "$selection_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["workflow_job_id"])
          PY
          )"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${merge_gate_run_id}" \
            > "$workflow_json"
          python3 scripts/candidate_merge_gate.py verify \
            "$workflow_json" "$REQUESTED_TARGET_SHA" "$GITHUB_REPOSITORY" \
            "$merge_gate_run_id" > "$verified_json"
          merge_gate_url="$(python3 - "$verified_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["html_url"])
          PY
          )"
          merge_gate_run_attempt="$(python3 - "$verified_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["run_attempt"])
          PY
          )"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${merge_gate_job_id}" \
            > "$workflow_job_json"
          python3 scripts/candidate_merge_gate.py verify-job \
            "$workflow_job_json" "$REQUESTED_TARGET_SHA" "$GITHUB_REPOSITORY" \
            "$merge_gate_check_run_id" "$merge_gate_job_id" \
            "$merge_gate_run_id" "$merge_gate_run_attempt" > "$verified_job_json"
          merge_gate_check_run_id="$(python3 - "$verified_job_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["check_run_id"])
          PY
          )"
          merge_gate_job_id="$(python3 - "$verified_job_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["workflow_job_id"])
          PY
          )"
          merge_gate_run_id="$(python3 - "$verified_job_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["workflow_run_id"])
          PY
          )"
          merge_gate_run_attempt="$(python3 - "$verified_job_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["run_attempt"])
          PY
          )"
          merge_gate_job_url="$(python3 - "$verified_job_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["html_url"])
          PY
          )"

          {
            printf 'target_sha=%s\n' "$REQUESTED_TARGET_SHA"
            printf 'merge_gate_check_run_id=%s\n' "$merge_gate_check_run_id"
            printf 'merge_gate_job_id=%s\n' "$merge_gate_job_id"
            printf 'merge_gate_run_id=%s\n' "$merge_gate_run_id"
            printf 'merge_gate_run_attempt=%s\n' "$merge_gate_run_attempt"
            printf 'merge_gate_job_url=%s\n' "$merge_gate_job_url"
            printf 'merge_gate_url=%s\n' "$merge_gate_url"
            printf 'candidate_workflow_definition_sha=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Validated candidate target $REQUESTED_TARGET_SHA via $merge_gate_url"

  # Native Rust candidate (ADR-0008), the only candidate since the R9 cutover.
  # Two independent exact-source builds on this runner must be byte-identical;
  # release-native.yml later republishes exactly these bytes and never rebuilds.
  native:
    name: Build Reproducible Native Candidate
    needs: validate
    runs-on: ubuntu-latest
    # build-native.sh compiles with two jobs, twice; the artifact corpus follows.
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout Validated Candidate Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm Exact Candidate Commit
        env:
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustc --version

      - name: Install the trace tool for the artifact corpus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace

      # Downloads only the HTTPS inputs pinned in packaging/native and checks
      # every digest; the inputs live outside the checkout so the source tree
      # stays clean for the exact-source build.
      - name: Prepare Pinned Native Build Inputs
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          scripts/prepare-native-inputs.sh --output "$RUNNER_TEMP/native-inputs"

      - name: Build Twice from the Exact Source
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          set -a
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/native-inputs/native-build.env"
          set +a
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          for build in a b; do
            mkdir -- "$RUNNER_TEMP/native-$build"
            scripts/build-native.sh \
              --tools-dir "$ICI_NATIVE_TOOLS_DIR" \
              --sysroot "$ICI_NATIVE_SYSROOT" \
              --sysroot-sha256 "$ICI_NATIVE_SYSROOT_SHA256" \
              --build-id "candidate-$build" \
              --output "$RUNNER_TEMP/native-$build/ici-$version-x86_64-unknown-linux-musl.tar.gz"
          done
          printf 'NATIVE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Run Native Release Checks and Artifact Corpus
        env:
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          name="ici-$NATIVE_VERSION-x86_64-unknown-linux-musl.tar.gz"
          archive="$RUNNER_TEMP/native-a/$name"
          evidence="$RUNNER_TEMP/native-evidence"
          scripts/check-native-release.sh --archive "$archive" \
            --compare "$RUNNER_TEMP/native-b/$name" \
            --expect-revision "$TARGET_SHA" --expect-version "$NATIVE_VERSION" \
            --allow-prerelease-version --evidence "$evidence/release-check"
          sha256="$(sha256sum -- "$archive" | cut -d ' ' -f1)"
          python3 -I tests/rust-parity/distribution/verify_artifact.py \
            --archive "$archive" --sha256 "$sha256" \
            --builder target/distribution/compiled-candidate-a/release/ici-dist \
            --installer scripts/install-native.sh --evidence "$evidence/artifact-corpus"
          bundle="$RUNNER_TEMP/ici-native-candidate"
          mkdir -- "$bundle"
          cp -- "$archive" "$archive.sha256" "$bundle/"
          cp -- "$evidence/release-check/check-native-release.json" "$bundle/release-check.json"
          cp -- "$evidence"/artifact-corpus/native-artifact-*/report.json "$bundle/artifact-corpus-report.json"
          printf 'NATIVE_ARCHIVE_SHA256=%s\n' "$sha256" >> "$GITHUB_ENV"

      - name: Upload Native Candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ici-native-candidate-${{ needs.validate.outputs.target_sha }}
          path: ${{ runner.temp }}/ici-native-candidate
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 14
          compression-level: 0

      - name: Record Native Candidate Coordinates
        env:
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          MERGE_GATE_URL: ${{ needs.validate.outputs.merge_gate_url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          {
            echo "## ici native candidate (not a release)"
            echo
            echo "- target commit: \`$TARGET_SHA\`"
            echo "- Merge Gate: $MERGE_GATE_URL"
            echo "- archive: \`ici-$NATIVE_VERSION-x86_64-unknown-linux-musl.tar.gz\`"
            echo "- archive SHA-256 (out-of-band input for Quality Zoo and release): \`$NATIVE_ARCHIVE_SHA256\`"
            echo "- two independent builds: byte-identical"
            echo "- artifact ID: \`$ARTIFACT_ID\`"
            echo "- authenticated download: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
