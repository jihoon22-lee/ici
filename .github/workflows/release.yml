name: Release ici

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v0.4.0)"
        required: true
        type: string
      draft:
        description: "Create Draft Release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as Pre-release"
        type: boolean
        default: false

permissions: {}

jobs:
  validate-release:
    name: Validate Release Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.provenance.outputs.TAG }}
      target_sha: ${{ steps.provenance.outputs.TARGET_SHA }}

    steps:
      - name: Checkout Workflow Ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Validate Tag, Main Ancestry, and Merge Gate
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$MANUAL_VERSION_TAG"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          # Manual dispatch may start from any selectable ref. Resolve the
          # existing tag ourselves, then detach at its commit so package and
          # release artifacts can never come from the dispatch branch by
          # accident. A tag push follows the exact same path.
          git fetch --force --tags origin \
            refs/heads/main:refs/remotes/origin/main
          if ! TARGET_SHA="$(git rev-parse --verify "$TAG^{commit}")"; then
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main; then
            echo "Release commit $TARGET_SHA is not reachable from origin/main" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/ici/__init__.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          value = ast.literal_eval(node.value)
                          if isinstance(value, str):
                              print(value)
                              raise SystemExit(0)
          raise SystemExit("src/ici/__init__.py does not define a string __version__")
          PY
          )"
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! grep -Fq "## [$PACKAGE_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $PACKAGE_VERSION" >&2
            exit 1
          fi

          # A PR check belongs to its head commit, while a squash merge creates
          # a new SHA. Requiring Merge Gate on TARGET_SHA therefore proves the
          # exact main commit passed the post-merge CI run, not merely a related
          # PR revision. Pages/report jobs can make that run finish shortly
          # after the tag is created, so allow bounded propagation time.
          gate_ok=false
          for attempt in $(seq 1 36); do
            gate="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100&filter=latest" \
              --jq '[.check_runs[] | select(.name == "Merge Gate")] | sort_by(.completed_at // "") | last // {} | [.status // "missing", .conclusion // "pending", .details_url // ""] | @tsv')"
            IFS=$'\t' read -r gate_status gate_conclusion gate_url <<< "$gate"
            echo "Merge Gate attempt $attempt/36: status=$gate_status conclusion=$gate_conclusion ${gate_url:-}"
            if [ "$gate_status" = completed ] && [ "$gate_conclusion" = success ]; then
              gate_ok=true
              break
            fi
            sleep 10
          done
          if [ "$gate_ok" != true ]; then
            echo "Exact release commit has no successful Merge Gate: $TARGET_SHA" >&2
            exit 1
          fi

          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'TARGET_SHA=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated release target: $TAG ($TARGET_SHA)"

  build-release:
    name: Build & Publish Release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Validated Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Exact Release Commit
        env:
          TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Installed before the tests, not after: the build-adapter E2E tests run
      # inside pytest and need cmake/qmake/Qt. Letting them skip here would ship
      # a release whose adapters were never exercised on this runner.
      - name: Install the Qt6 build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qmake6 pkg-config

      - name: Enforce Ruff Quality Gate
        run: |
          uv run --python 3.10 ruff check .
          uv run --python 3.10 ruff format --check .

      - name: Run Test Suite
        env:
          # A skip means something broke, not that the tests are optional (C-6).
          ICI_REQUIRE_BUILD_ADAPTERS: "1"
        run: |
          uv run --python 3.10 pytest -v

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh
          sha256sum dist/ici.pyz > dist/ici.pyz.sha256

      - name: Run Isolated Smoke Test
        run: |
          ./scripts/smoke.sh

      - name: Dogfood the Release Candidate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          dist/ici.pyz verify \
            --report \
            --html dist/ici-self-report.html \
            --github-summary
          mv verify_report.json dist/ici-self-report.json

          (
            cd viewer
            ../dist/ici.pyz verify \
              --report \
              --html ../dist/viewer-report.html \
              --github-summary
          )
          mv viewer/verify_report.json dist/viewer-report.json

      # Two viewer artifacts, and the difference between them matters.
      #
      # icirv is the Qt-free CLI, linked statically so it runs wherever it is
      # copied. glibc is not forward compatible and the closed-network target is
      # RHEL 8 (glibc 2.28) while this runner is Ubuntu (2.39), so a dynamically
      # linked build would not start there. Static removes the question.
      #
      # icirv-gui needs Qt at runtime, so it is a development-environment asset
      # only: it wants glibc 2.34+ and Qt 6 present. Making it portable to RHEL 8
      # means building Qt inside an almalinux:8 container and bundling or
      # statically linking it — worth doing, deliberately not done here.
      - name: Build Viewer CLI (static)
        run: |
          set -euo pipefail
          cmake -S viewer -B viewer/build-cli -DCMAKE_BUILD_TYPE=Release -DICIRV_BUILD_GUI=OFF
          cmake --build viewer/build-cli --target icirv --parallel
          mkdir -p dist
          cp viewer/build-cli/icirv dist/icirv
          if ldd dist/icirv 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::icirv is not statically linked; it would not run on the closed-network target"
            ldd dist/icirv || true
            exit 1
          fi
          dist/icirv viewer/tests/data/ici_self_report.json > /dev/null
          echo "icirv: static, and it parses a real report"

      - name: Build Viewer GUI (development asset)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake -S viewer -B viewer/build/gui -DCMAKE_BUILD_TYPE=Release -DICIRV_BUILD_GUI=ON
          # CTest registers the core, CLI and GUI tests. Build the complete
          # configured graph so every registered executable exists before the
          # release gate runs it.
          cmake --build viewer/build/gui --parallel
          ctest --test-dir viewer/build/gui --output-on-failure
          cp viewer/build/gui/src/gui/icirv-gui dist/icirv-gui
          dist/icirv-gui "$PWD/viewer/tests/data/ici_self_report.json" &
          gui_pid=$!
          cleanup_gui() {
            kill "$gui_pid" 2>/dev/null || true
            wait "$gui_pid" 2>/dev/null || true
          }
          trap cleanup_gui EXIT
          sleep 5
          if ! kill -0 "$gui_pid" 2>/dev/null; then
            echo "::error::icirv-gui exited during the release smoke test"
            exit 1
          fi
          # Record what it actually needs, so the requirement is discoverable
          # from the release rather than by trial and error on a target machine.
          {
            echo "icirv-gui — ici report viewer (development environments)"
            echo
            echo "Requires Qt 6 Widgets at runtime and glibc $(objdump -T dist/icirv-gui | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | cut -d_ -f2)+."
            echo "It will NOT run on RHEL 8 (glibc 2.28, no Qt 6 packages)."
            echo "Use the statically linked icirv CLI there instead."
            echo
            echo "Shared libraries:"
            ldd dist/icirv-gui | grep -i qt || true
          } > dist/icirv-gui.README.txt
          cat dist/icirv-gui.README.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          python3 - << 'EOF'
          import os
          import re

          raw_tag = os.environ.get("TAG_NAME", "")
          clean_ver = raw_tag.lstrip("v")
          changelog_path = "CHANGELOG.md"

          body = ""
          if os.path.exists(changelog_path):
              content = open(changelog_path, "r", encoding="utf-8").read()
              # Match the requested version up to the next version heading or EOF.
              pattern = rf"##\s*\[{re.escape(clean_ver)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  body = match.group(1).strip()

          if not body:
              body = f"### 🚀 ici {raw_tag} Release\n\n- Unified CI/CD Quality Gate ZipApp binary."

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          EOF
        env:
          TAG_NAME: ${{ needs.validate-release.outputs.tag }}

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: "ici ${{ needs.validate-release.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/ici.pyz
            dist/ici.pyz.sha256
            dist/ici-self-report.html
            dist/ici-self-report.json
            dist/viewer-report.html
            dist/viewer-report.json
            dist/icirv
            dist/icirv-gui
            dist/icirv-gui.README.txt
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
