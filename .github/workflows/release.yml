name: Release ici

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v0.4.0)"
        required: true
        type: string
      draft:
        description: "Create Draft Release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as Pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Determine Target Tag
        id: tag_info
        env:
          MANUAL_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$MANUAL_VERSION_TAG"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/ici/__init__.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          value = ast.literal_eval(node.value)
                          if isinstance(value, str):
                              print(value)
                              raise SystemExit(0)
          raise SystemExit("src/ici/__init__.py does not define a string __version__")
          PY
          )"
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi

          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - name: Run Test Suite
        run: |
          uv run --python 3.10 pytest -v

      - name: Build Standalone ZipApp (dist/ici.pyz)
        run: |
          chmod +x ./scripts/build-pyz.sh ./scripts/smoke.sh ./scripts/launcher.sh
          ./scripts/build-pyz.sh
          sha256sum dist/ici.pyz > dist/ici.pyz.sha256

      - name: Run Isolated Smoke Test
        run: |
          ./scripts/smoke.sh

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          python3 - << 'EOF'
          import os
          import re

          raw_tag = os.environ.get("TAG_NAME", "")
          clean_ver = raw_tag.lstrip("v")
          changelog_path = "CHANGELOG.md"

          body = ""
          if os.path.exists(changelog_path):
              content = open(changelog_path, "r", encoding="utf-8").read()
              # Match the requested version up to the next version heading or EOF.
              pattern = rf"##\s*\[{re.escape(clean_ver)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  body = match.group(1).strip()

          if not body:
              body = f"### 🚀 ici {raw_tag} Release\n\n- Unified CI/CD Quality Gate ZipApp binary."

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          EOF
        env:
          TAG_NAME: ${{ steps.tag_info.outputs.TAG }}

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: "ici ${{ steps.tag_info.outputs.TAG }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/ici.pyz
            dist/ici.pyz.sha256
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
