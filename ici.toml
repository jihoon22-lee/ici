# ici — Standard Enterprise CI/CD Quality Gate Configuration
# 이 설정 파일은 ici 프로젝트의 표준 품질 정책을 정의합니다.

[ici]
version = "0.5.2"
policy_name = "Enterprise CI/CD Standard Quality Gate"

[doctor]
required_tools = []

[engines.line]
enabled = true
mode = "pass_warn_fail"   # pass_warn_fail | pass_fail | pass_warn
warn_limit = 500          # 순수 코드 500라인 초과 시 경고
fail_limit = 1000         # 순수 코드 1000라인 초과 시 실패

[engines.lint]
enabled = true
mode = "pass_warn_fail"
# 배포 기본값(config.py DEFAULT_CONFIG)은 ruff 를 선택 사항으로 두고 없으면 AST 폴백으로 내려가지만,
# ici 자체 검증에서는 필수다. ruff 가 없으면 lint 는 검사 대상을 하나도 보고하지 않은 채
# ESTIMATED/WARN 으로 통과하는데, 그러면 게이트가 초록불인 채로 실제 린팅은 일어나지 않는다.
# 실제로 v0.5.1 까지 CI 가 이 상태였다 — uvx 는 임시 실행이라 PATH 에 ruff 를 남기지 않았다.
ruff_required = true

[engines.test]
enabled = true
mode = "pass_fail"
# Dogfood baseline (CI/local, 2026-08-24): TEM ~4.72/5.0, Line ~83.6%, Func ~94.3%.
# Keep strict pass_fail semantics while leaving headroom for runner/tool jitter.
min_tem_score = 2.0       # TEM 점수 2.0 이상 통과
min_branch_cov = 35.0     # Branch 커버리지 35% 이상
min_func_cov = 60.0       # Function 커버리지 60% 이상

[engines.type]
enabled = true
mode = "pass_warn"
fail_on_error = true
warn_on_missing_annotation = false
# Set true to make missing mypy an ERROR/NOT_RUN result.
mypy_required = false

[engines.complexity]
enabled = true
mode = "pass_warn_fail"
warn_cc = 15              # 순환 복잡도 15 초과 시 경고
fail_cc = 25              # 순환 복잡도 25 초과 시 실패
warn_nesting = 4          # 중첩 깊이 4 이상 시 경고

[engines.sanitize]
enabled = true
mode = "pass_fail"

[engines.dead]
enabled = true
mode = "pass_warn"

[engines.dup]
enabled = true
mode = "pass_warn"
warn_pct = 5.0            # 중복률 5.0% 초과 시 경고
fail_pct = 15.0           # 중복률 15.0% 초과 시 실패
min_window = 6            # 6라인 이상 연속 복제 감지

[engines.exception]
enabled = true
mode = "pass_fail"

[engines.cycle]
enabled = true
mode = "pass_warn_fail"
max_reported = 20         # 리포트에 포함할 최대 순환 참조 개수
# 휴리스틱 엔진(basename 기반 C++ include 해석, 베스트에포트 Python 모듈 매핑)이므로
# required는 기본 false — ERROR가 나도 전체 게이트를 막지 않는다.
required = false

[engines.cognitive]
enabled = false            # 기본 비활성 — 필요 시 옵트인
mode = "pass_warn"
warn = 30                  # 인지 복잡도 30 초과 시 경고
fail = 60                  # 인지 복잡도 60 초과 시 경고로 강등(pass_warn 모드는 FAIL을 내지 않음)
warn_nesting = 4

[engines.security]
enabled = true
mode = "pass_warn"
scan_tests = false        # true면 tests/ 디렉터리도 함께 스캔

[engines.resource]
enabled = true
mode = "pass_warn"
