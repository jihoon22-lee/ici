# ici dogfood configuration for this repository (native schema, ADR-0008).
#
# The product is the Rust workspace under crates/. Its own gate is the CI `rust`
# job (cargo fmt, cargo clippy --all-targets -D warnings, cargo test), and the
# native binary is dogfooded on a real C++ project from viewer/ (its own
# ici.toml and ici-static-cli.toml). This root run analyses what is left at the
# top level: the development-harness Python (the migration ledger, the
# candidate Merge Gate audit and their unittest suites under scripts/tests).
schema_version = 2

# Trees that are inputs for ici rather than code of ici:
# - parity-fixtures/, quality-zoo/: deliberately defective known-answer corpora;
# - tests/rust-parity/: frozen-oracle golden data and capture drivers that run
#   against the v0.13.0 oracle, not this checkout;
# - viewer/: a separate C++ project with its own configuration.
extend_exclude = ["parity-fixtures", "quality-zoo", "tests/rust-parity", "viewer"]

[python]
# A cargo-built binary carries no native tool pack, so the harness venv's mypy
# (uv sync --frozen --python 3.10) is the type checker.
type_provider = "mypy"

# Already gated by the CI `rust` job with --all-targets -D warnings; running it
# here would compile the whole workspace a second time in the dogfood job.
[checks."rust.clippy"]
enabled = false

# The harness suites are stdlib unittest and run as their own CI steps
# (scripts/tests, quality-zoo/tests); pytest reports them without per-test
# verdicts, so the native test/coverage checks would only report INCOMPLETE.
[checks."python.test"]
enabled = false
[checks."python.coverage"]
enabled = false

# crates/ici-reporting/assets/native.js is embedded in the HTML report and is
# exercised by the Rust reporting tests; the repository carries no ESLint
# configuration for it.
[checks."javascript.lint"]
enabled = false

# Known harness debt, measured 2026-11-14 on the cutover branch with the native
# binary (this file with these checks enabled): the native gate counts every
# medium/high finding as a violation, and the harness reports 47 of them —
# scripts/rust_migration_inventory.py has 1,439 code lines and functions up to
# cyclomatic complexity 32 and cognitive complexity 92, the candidate audit and
# its tests share 17 clone groups (5.1%), and mypy reports 20 diagnostics on
# ast-node attribute access. These are development tools, not product code;
# the five checks stay off until the harness is split and typed. Ruff lint and
# format, compatibility, cycles, dead code, security, resource and exception
# checks still gate it.
[checks."python.line"]
enabled = false
[checks."python.complexity"]
enabled = false
[checks."python.cognitive"]
enabled = false
[checks."python.dup"]
enabled = false
[checks."python.type"]
enabled = false
