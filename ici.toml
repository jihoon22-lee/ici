schema_version = 1

[workspace]
name = "ici"
profile = "standard"

[[components]]
id = "ici"
root = "."
languages = ["python"]
sources = ["src/**/*.py"]

[components.python]
executable = ".venv/bin/python"
type_provider = "mypy"
test_tools = "project"
test_paths = ["tests"]

# Heuristic-measurement checks stay advisory: their findings are measured and
# reported, but the gate reserves FAIL for checks with a binary contract
# (lint, format, type, tests, dead code, cycles). The numeric contract these
# used to carry as stable's warn/fail bands lives in
# scripts/check_next_floors.py, asserted against the result document.
[checks."python.dup"]
required = false

[checks."python.complexity"]
required = false

[checks."python.cognitive"]
required = false

[checks."python.line"]
required = false
