# ici — Standard Enterprise CI/CD Quality Gate Configuration
# 이 설정 파일은 ici 프로젝트의 표준 품질 정책을 정의합니다.

[ici]
version = "0.7.0"
policy_name = "Enterprise CI/CD Standard Quality Gate"

[doctor]
required_tools = []

[engines.line]
enabled = true
mode = "pass_warn_fail"   # pass_warn_fail | pass_fail | pass_warn
warn_limit = 500          # 순수 코드 500라인 초과 시 경고
fail_limit = 1000         # 순수 코드 1000라인 초과 시 실패

[engines.lint]
enabled = true
mode = "pass_warn_fail"
# 배포 기본값(config.py DEFAULT_CONFIG)은 ruff 를 선택 사항으로 두고 없으면 AST 폴백으로 내려가지만,
# ici 자체 검증에서는 필수다. ruff 가 없으면 lint 는 검사 대상을 하나도 보고하지 않은 채
# ESTIMATED/WARN 으로 통과하는데, 그러면 게이트가 초록불인 채로 실제 린팅은 일어나지 않는다.
# 실제로 v0.5.1 까지 CI 가 이 상태였다 — uvx 는 임시 실행이라 PATH 에 ruff 를 남기지 않았다.
ruff_required = true

[engines.test]
enabled = true
mode = "pass_fail"
# Dogfood baseline (origin/main@fa3ad28, 2026-08-31): three consecutive runs
# measured TEM 4.78/5.0, Line 85.9%, Branch 77.9%, Function 95.691%, with
# 634/634 tests passing. The values were identical across all three runs.
# These floors retain runner/toolchain headroom while replacing the stale
# 2.0/35/60 policy. Ratchet only after a later implementation change records
# three consecutive runs at or above the current floor plus the same margin
# (TEM +0.10, Branch +3pp, Function +3pp) with measured coverage and no new
# unexplained test/tool warnings; then raise one floor at a time.
min_tem_score = 4.5       # measured 4.78; 0.28 points of headroom
min_branch_cov = 70.0     # measured 77.9%; 7.9 percentage points of headroom
min_func_cov = 90.0       # measured 95.691%; 5.691 percentage points of headroom

[engines.type]
enabled = true
mode = "pass_warn"
fail_on_error = true
warn_on_missing_annotation = false
# Set true to make missing mypy an ERROR/NOT_RUN result.
mypy_required = false

[engines.complexity]
enabled = true
mode = "pass_warn_fail"
warn_cc = 15              # 순환 복잡도 15 초과 시 경고
fail_cc = 25              # 순환 복잡도 25 초과 시 실패
warn_nesting = 4          # 중첩 깊이 4 이상 시 경고

[engines.sanitize]
enabled = true
mode = "pass_fail"

[engines.dead]
enabled = true
mode = "pass_warn"

[engines.dup]
enabled = true
mode = "pass_warn"
warn_pct = 5.0            # 중복률 5.0% 초과 시 경고
fail_pct = 15.0           # 중복률 15.0% 초과 시 실패
min_window = 6            # 6라인 이상 연속 복제 감지

[engines.exception]
enabled = true
mode = "pass_fail"

[engines.cycle]
enabled = true
mode = "pass_warn_fail"
max_reported = 20         # 리포트에 포함할 최대 순환 참조 개수
# 휴리스틱 엔진(basename 기반 C++ include 해석, 베스트에포트 Python 모듈 매핑)이므로
# required는 기본 false — ERROR가 나도 전체 게이트를 막지 않는다.
required = false

[engines.cognitive]
enabled = true             # deep profile에서만 선택; fast/standard는 descriptor가 제외
mode = "pass_warn"
warn = 30                  # 인지 복잡도 30 초과 시 경고
fail = 60                  # 인지 복잡도 60 초과 시 경고로 강등(pass_warn 모드는 FAIL을 내지 않음)
warn_nesting = 4

[engines.security]
enabled = true
mode = "pass_warn"
scan_tests = false        # true면 tests/ 디렉터리도 함께 스캔

[engines.resource]
enabled = true
mode = "pass_warn"
