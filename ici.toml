# ici — Standard Enterprise CI/CD Quality Gate Configuration
# 이 설정 파일은 ici 프로젝트의 표준 품질 정책을 정의합니다.

[ici]
version = "0.4.2"
policy_name = "Enterprise CI/CD Standard Quality Gate"

[engines.line]
enabled = true
mode = "pass_warn_fail"   # pass_warn_fail | pass_fail | pass_warn
warn_limit = 500          # 순수 코드 500라인 초과 시 경고
fail_limit = 1000         # 순수 코드 1000라인 초과 시 실패

[engines.lint]
enabled = true
mode = "pass_warn_fail"
# Ruff is optional by default; absence uses an ESTIMATED AST syntax fallback.
ruff_required = false

[engines.test]
enabled = true
mode = "pass_fail"
# Dogfood baseline (CI/local): TEM 2.35–2.52, Branch 42.7–42.8%, Function 67.8%.
# Keep strict pass_fail semantics while leaving headroom for runner/tool jitter.
min_tem_score = 2.0       # TEM 점수 2.0 이상 통과
min_branch_cov = 35.0     # Branch 커버리지 35% 이상
min_func_cov = 60.0       # Function 커버리지 60% 이상

[engines.type]
enabled = true
mode = "pass_warn"
fail_on_error = true
warn_on_missing_annotation = false
# Set true to make missing mypy an ERROR/NOT_RUN result.
mypy_required = false

[engines.complexity]
enabled = true
mode = "pass_warn_fail"
warn_cc = 15              # 순환 복잡도 15 초과 시 경고
fail_cc = 25              # 순환 복잡도 25 초과 시 실패
warn_nesting = 4          # 중첩 깊이 4 이상 시 경고

[engines.sanitize]
enabled = true
mode = "pass_fail"

[engines.dead]
enabled = true
mode = "pass_warn"

[engines.dup]
enabled = true
mode = "pass_warn"
warn_pct = 5.0            # 중복률 5.0% 초과 시 경고
fail_pct = 15.0           # 중복률 15.0% 초과 시 실패
min_window = 6            # 6라인 이상 연속 복제 감지

[engines.exception]
enabled = true
mode = "pass_fail"
