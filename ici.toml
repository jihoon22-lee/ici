# ici — Standard Enterprise CI/CD Quality Gate Configuration
# 이 설정 파일은 ici 프로젝트의 표준 품질 정책을 정의합니다.

[ici]
version = "0.11.0"
policy_name = "Enterprise CI/CD Standard Quality Gate"

[doctor]
required_tools = []

[engines.line]
enabled = true
mode = "pass_warn_fail"   # pass_warn_fail | pass_fail | pass_warn
warn_limit = 500          # 순수 코드 500라인 초과 시 경고
fail_limit = 1000         # 순수 코드 1000라인 초과 시 실패

[engines.lint]
enabled = true
mode = "pass_warn_fail"
# 배포 기본값(config.py DEFAULT_CONFIG)은 ruff 를 선택 사항으로 두고 없으면 AST 폴백으로 내려가지만,
# ici 자체 검증에서는 필수다. ruff 가 없으면 lint 는 검사 대상을 하나도 보고하지 않은 채
# ESTIMATED/WARN 으로 통과하는데, 그러면 게이트가 초록불인 채로 실제 린팅은 일어나지 않는다.
# 실제로 v0.5.1 까지 CI 가 이 상태였다 — uvx 는 임시 실행이라 PATH 에 ruff 를 남기지 않았다.
ruff_required = true

[engines.test]
enabled = true
mode = "pass_fail"
# Dogfood gate. Every coverage dimension stays explicit so a future distribution
# default cannot silently redefine ici's own gate.
#
# Ratcheted 2026-09-06 from four consecutive measured runs on the current suite,
# which agreed to within 0.2 points on every dimension: line 89.0/89.1/89.1/89.2,
# branch 80.9/81.0/81.0/81.1, function 95.89/95.90/96.2, TEM 4.78/4.78/4.79.
# The previous floors were set against a smaller suite and had drifted 9-11
# points below what the repository actually measures, which is wide enough that
# a real regression could land without the gate noticing.
#
# Headroom is deliberately sized to survive ordinary work rather than to sit
# just under the measurement. One refactoring PR moved function coverage by 0.3,
# so a one-point margin would fire on routine changes.
min_tem_score = 4.7       # measured 4.78; 0.08 headroom, and TEM moves by ~0.03 a run
min_line_cov = 86.0       # measured 89.2%; 3.2 points of headroom
# The binding file is src/ici/reporters/html/sections/complexity.py at 12.9% of
# 62 statements, where one statement is 1.6 points. This floor is therefore the
# tightest of the five in practice: adding untested code to the repository's
# least-covered file is exactly what it is meant to stop.
min_file_cov = 12.0       # measured minimum 12.9%; explicit debt floor, not a product default
min_file_statements = 5   # exclude only genuinely tiny modules from the file gate
min_branch_cov = 78.0     # measured 81.1%; 3.1 points of headroom
min_func_cov = 94.0       # measured 95.9%; 1.9 points of headroom

[engines.type]
enabled = true
mode = "pass_warn"
fail_on_error = true
warn_on_missing_annotation = false
# ici dogfood requires the tool and opts into additional untyped-body hygiene.
# Project configuration remains auto-discovered by mypy from this repository.
mypy_required = true
mypy_profile = "ici"

[engines.python_compat]
enabled = true
mode = "pass_warn_fail"
required = false
# ici declares requires-python >= 3.10 and no upper bound, so "supported" has to
# mean two measured runtimes, not one: the floor, and the newest release the
# project actually claims to run on. Listing them here makes both a measurement
# instead of a README sentence. The floor is required — a self-verification that
# cannot find python3.10 has not verified the floor it advertises. The newest
# runtime stays optional so this config still works on a machine that has only
# the floor installed; CI installs both, and the report's per-runtime
# PythonRuntime targets are the evidence that both were exercised.
target_version = "3.10"
interpreters = ["python3.10", "python3.14"]
required_interpreters = ["python3.10"]
imports = ["ici"]

[engines.complexity]
enabled = true
mode = "pass_warn_fail"
warn_cc = 15              # 순환 복잡도 15 초과 시 경고
fail_cc = 25              # 순환 복잡도 25 초과 시 실패
warn_nesting = 4          # 중첩 깊이 4 이상 시 경고

[engines.sanitize]
enabled = true
mode = "pass_fail"

[engines.dead]
enabled = true
mode = "pass_warn"
cpp_unused = "auto"      # auto | required | off
cpp_linker = "off"       # auto | required | off (Linux GNU ELF CMake section-GC)

[engines.dup]
enabled = true
mode = "pass_warn"
warn_pct = 5.0            # 중복률 5.0% 초과 시 경고
fail_pct = 15.0           # 중복률 15.0% 초과 시 실패
# 배포 기본값은 6이지만 이 저장소에서는 10을 쓴다. 6~8라인 구간이 지표를 지배하는데,
# 그 대부분이 core/support.py 의 SupportDeclaration 선언 테이블이나 C++ 도구 어댑터가
# 공유하는 bounded intake/replay 상용구처럼 구조가 같아야 옳은 코드다. 실측하면
# min_window 6 은 674 그룹 11.6%, 8 은 311 그룹 6.5%, 10 은 129 그룹 3.4%,
# 15 는 29 그룹 1.1% 이고 6~8라인 그룹만 471 개다. 10 은 실제로 추출할 가치가 있는
# 중복만 남긴다. 소비자 프로젝트에는 6 이 여전히 유효한 신호이므로 기본값은 바꾸지 않는다.
min_window = 10           # 10라인 이상 연속 복제 감지 (배포 기본값 6)
python_semantic = "auto"  # auto | required | off (bounded Python AST-shape clones)

[engines.exception]
enabled = true
mode = "pass_fail"

[engines.cycle]
enabled = true
mode = "pass_warn_fail"
max_reported = 20         # 리포트에 포함할 최대 순환 참조 개수
# 휴리스틱 엔진(basename 기반 C++ include 해석, 베스트에포트 Python 모듈 매핑)이므로
# required는 기본 false — ERROR가 나도 전체 게이트를 막지 않는다.
required = false

[engines.cognitive]
enabled = true             # deep profile에서만 선택; fast/standard는 descriptor가 제외
mode = "pass_warn"
warn = 30                  # 인지 복잡도 30 초과 시 경고
fail = 60                  # 인지 복잡도 60 초과 시 경고로 강등(pass_warn 모드는 FAIL을 내지 않음)
warn_nesting = 4

[engines.security]
enabled = true
mode = "pass_warn"
scan_tests = false        # true면 tests/ 디렉터리도 함께 스캔

[engines.resource]
enabled = true
mode = "pass_warn"
